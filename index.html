  float h=S.x;
  vec3 Nm=normalize(vec3(-S.y,-S.z,1.));
  vec2 gn=(g2.xy*2.-1.)*(1.-0.45*pk);
  vec3 N=normalize(Nm+vec3(gn,0.));
  vec3 L=normalize(uL);
  float sh=clamp(SL.x,0.,1.), ao=SL.y;
  // grain-scale contact shadows along the light direction
  vec2 l2=normalize(L.xy+1e-5); float tanE=L.z/max(length(L.xy),1e-3);
  float gs=1.;
  for(int k=1;k<=3;k++){
    float dpx=float(k)*1.15;
    float hn=textureGrad(uG0, guv + l2*dpx/uGT, dxu, dyu).a;
    gs=min(gs, clamp(1.-(hn-gh-dpx*tanE*0.36)*3.4, 0.,1.));
  }
  float cav=smoothstep(0.0,0.5,gh)*g2.z;      // 0 deep in the gaps and crevices between grains
  cav=mix(cav, 0.7+0.3*cav, pk);               // packed: grains pressed together, shallower gaps
  gs=mix(gs, 1., 0.65*pk);                     // ... and no grain sticking up to cast a contact shadow
  float diff=roughDiffuse(N,L,0.3);
  // let the sculpted relief read a little stronger than the grain-scale shading would give alone
  float ndlM=max(dot(Nm,L),0.);
  diff*=0.55+0.45*ndlM/max(L.z,0.15);
  // multiple scattering between grains: sand in shadow is warmer and more saturated than lit sand
  vec3 albM=alb*mix(vec3(1.), clamp(alb*2.4,0.,1.2), 0.4);
  vec3 col = alb*uSun*(diff*sh*gs*mix(0.6,1.,cav))
           + albM*uSky*(0.55+0.45*N.z)*ao*mix(0.5,1.,cav);
  // light leaking through translucent quartz on the lit side
  col += albM*uSun*0.09*g1.z*sh*smoothstep(0.3,0.85,gh);
  // rare tiny glints from quartz facets (twinkle as the phone tilts against the room light)
  vec3 fn=normalize(vec3((g1.xy*2.-1.)*0.7,1.)+vec3(Nm.xy,0.));
  vec3 Hh=normalize(L+vec3(0.,0.,1.));
  float gl=pow(max(dot(fn,Hh),0.),900.)*step(0.8,g1.z)*smoothstep(0.6,0.95,g1.w);
  col += uSun*gl*10.*sh*gs*(1.-0.7*pk);
  // tray floor (dark slate) where the sand has been pushed away
  float cov=smoothstep(-0.06,0.06, h*0.6 - 0.62*(1.-gh) - 0.03);
  float sd=0.05+0.35*smoothstep(0.0,0.8,h);                 // loose grains left on the floor, denser near the sand
  float stray=step(g1.y,sd)*smoothstep(0.25,0.45,gh);
  cov=max(cov,stray);
  if(cov<0.999){
    float m1=vnoise(nat*(1./70.)), m2=vnoise(nat*(1./13.)+31.), m3=hash12(floor(nat*uPx*0.6));
    vec3 slate=vec3(0.095,0.094,0.098)*(0.72+0.38*m1+0.16*m2+0.10*m3);
    // dust film: thick near the sand, and in faint smudges where sand has been dragged
    float dust=clamp(smoothstep(0.0,0.9,h)*0.8 + smoothstep(0.5,0.9,vnoise(pu*(1./17.)+9.))*0.22 + 0.06, 0.,1.);
    vec3 floorAlb=mix(slate, vec3(0.30,0.23,0.16)*0.6, dust*0.45);
    // stray grains cast tiny shadows away from the light
    vec2 su=guv+l2*2.0/uGT;
    float sg=textureGrad(uG0,su,dxu,dyu).a, sid=textureGrad(uG1,su,dxu,dyu).y;
    float sshadow=step(sid,sd)*smoothstep(0.25,0.5,sg);
    vec3 floorL=floorAlb*(uSun*max(L.z,0.)*sh*(1.-0.75*sshadow) + uSky*ao*(1.-0.3*sshadow));
    // a faint broad sheen of the lamp on the polished stone
    floorL+=uSun*0.004*(0.6+0.4*m1)*sh*(1.-dust);
    col=mix(floorL, col, cov);
  }
  if(uHasW==1){
    // ---- moat water: a silty, see-through layer over wet sand, with live ripples and lamp glints ----
    vec2 c2=tc-0.5; ivec2 j0=ivec2(floor(c2)); vec2 fj=c2-vec2(j0);
    vec4 w00=texelFetch(uWD,clamp(j0,ivec2(0),uN-ivec2(1)),0), w10=texelFetch(uWD,clamp(j0+ivec2(1,0),ivec2(0),uN-ivec2(1)),0);
    vec4 w01=texelFetch(uWD,clamp(j0+ivec2(0,1),ivec2(0),uN-ivec2(1)),0), w11=texelFetch(uWD,clamp(j0+ivec2(1,1),ivec2(0),uN-ivec2(1)),0);
    float wet=mix(mix(w00.y,w10.y,fj.x), mix(w01.y,w11.y,fj.x), fj.y);
    // the water surface, from the corners that hold water (a dry corner's sand may stand above it: that is the shore)
    vec4 bw=vec4((1.-fj.x)*(1.-fj.y), fj.x*(1.-fj.y), (1.-fj.x)*fj.y, fj.x*fj.y)*step(vec4(0.004),vec4(w00.x,w10.x,w01.x,w11.x));
    float ws=bw.x+bw.y+bw.z+bw.w;
    if(ws>0. || wet>0.004){
      float wsurf0= ws>0. ? dot(bw,vec4(w00.z,w10.z,w01.z,w11.z))/ws : -1e6;
      float sp= ws>0. ? dot(bw,vec4(w00.w,w10.w,w01.w,w11.w))/ws : 0.;
      float dmax=max(max(w00.x,w10.x),max(w01.x,w11.x));
      float rip=uWRip+min(2.,sp*0.03);
      // ripples: two drifting wave fields, stronger when the tray is shaken or the water is running
      vec2 q=nat*0.11; float t=uTime;
      float e=0.6;
      #define RIP(P) (vnoise((P)+vec2(t*0.55,t*0.31))+0.7*vnoise((P)*1.7-vec2(t*0.42,-t*0.63)+9.1)+0.35*vnoise((P)*3.3+vec2(-t*0.9,t*0.7)+3.7))
      float r0=RIP(q), rx=RIP(q+vec2(e,0.)), ry=RIP(q+vec2(0.,e));
      vec2 rg=vec2(rx-r0, ry-r0)/e*rip;
      float depth=wsurf0+(r0-1.)*0.04*rip-h;            // cells of water above the sand
      float a=smoothstep(0.0,0.22,depth)*smoothstep(0.06,0.2,dmax);
      float front=smoothstep(12.,60.,sp)*a;             // running water catches the light
      // wet sand: under the water, and wherever the water has been until it dries
      wet=max(wet*0.9,a);
      col*=mix(vec3(1.), vec3(0.56,0.55,0.56), wet);
      if(a>0.){
        float dpx=max(depth,0.)*uCs;
        vec3 Tr=exp(-vec3(0.075,0.040,0.034)*dpx);
        // light focused by the ripples onto the bottom (caustics)
        float ca=vnoise(nat*0.21+rg*5.+vec2(t*0.8,-t*0.5)); ca=pow(ca,3.)*2.2;
        vec3 bottom=col*(1.+ca*clamp(dpx/7.,0.,1.)*sh*0.9);
        // silt in the water scatters light back up: it reads as murky blue-green even in the shade of the banks
        vec3 ins=vec3(0.060,0.150,0.165)*(uSun*max(L.z,0.)*mix(0.55,0.7,sh)+uSky*3.2);
        vec3 wcol=bottom*Tr+ins*(1.-Tr);
        vec3 Nw=normalize(vec3(-rg*0.55, 1.));
        vec3 Rv=reflect(vec3(0.,0.,-1.),Nw);
        float F=0.035+0.965*pow(1.-Nw.z,5.)+0.05*smoothstep(0.9,1.6,r0);
        // reflection of the room: dim walls, and the warm lamp low on one side
        vec3 env=uSky*(1.6+1.2*Rv.z)+uSun*0.5*pow(max(dot(Rv,L),0.),6.);
        vec3 Hv=normalize(L+vec3(0.,0.,1.));
        float spec=pow(max(dot(Nw,Hv),0.),600.)*5.+pow(max(dot(Nw,Hv),0.),40.)*0.05;
        // the meniscus along the banks and the advancing front catch the light
        float shore=(1.-smoothstep(0.,0.5,depth))*0.55+front*0.5;
        wcol+=env*F+uSky*0.10*shore+uSun*sh*(spec+0.03*shore*(0.5+ca));
        col=mix(col, wcol, a);
      }
    }
  }
  // gentle falloff of the lamp across the tray
  vec2 vq=gl_FragCoord.xy/uCanvas-0.5;
  col*=1.-0.22*dot(vq,vq);
  col=srgb(aces(col*uExposure));
  col+=(hash12(gl_FragCoord.xy+fract(uTime)*91.)-0.5)/255.;
  o=vec4(col,1.);
}`;

/* Airborne grains (pour stream, flicks) drawn as lit points with cast shadows */
const VS_PART = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
layout(location=0) in vec4 aP; // nat x,y (cells), z (cells above floor), seed
uniform vec2 uR0, uR1, uROff; uniform vec2 uScreen; uniform float uCs, uPx; uniform vec3 uL; uniform float uShadow;
out float vSeed; out float vZ;
void main(){
  vec2 nat=aP.xy*uCs;
  if(uShadow>0.5){ nat -= uL.xy/max(uL.z,0.2)*aP.z*uCs; }
  vec2 d=nat-uROff;
  vec2 sc=vec2(uR0.x*d.x+uR1.x*d.y, uR0.y*d.x+uR1.y*d.y); // inverse rotation (transpose)
  vec2 ndc=vec2(sc.x/uScreen.x*2.-1., 1.-sc.y/uScreen.y*2.);
  gl_Position=vec4(ndc,0.,1.);
  gl_PointSize=max(1.5, uCs*uPx*(0.78+0.004*aP.z)*(0.8+0.4*fract(aP.w*7.3)));
  vSeed=aP.w; vZ=aP.z;
}`;
const FS_PART = HDR + `
in float vSeed; in float vZ; uniform float uShadow; uniform vec3 uL, uSun, uSky; uniform float uExposure;
out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-0.055, step(vec3(0.0031308),c)); }
void main(){
  vec2 c=gl_PointCoord*2.-1.; float r=dot(c,c); if(r>1.) discard;
  if(uShadow>0.5){ o=vec4(0.,0.,0.,0.3*(1.-r)/(1.+vZ*0.08)); return; }
  float s=fract(vSeed*13.7);
  vec3 alb = s<0.5?vec3(0.80,0.66,0.48):(s<0.7?vec3(0.76,0.59,0.40):(s<0.82?vec3(0.86,0.80,0.68):(s<0.95?vec3(0.62,0.46,0.32):vec3(0.15,0.13,0.12))));
  alb=pow(alb,vec3(2.2));
  vec3 n=vec3(c.x,c.y*-1.,sqrt(max(1.-r,0.)));
  vec3 L=normalize(uL);
  vec3 col=alb*(uSun*max(dot(n,vec3(L.x,-L.y,L.z)),0.)+uSky*(0.6+0.4*n.z));
  col=srgb(aces(col*uExposure));
  o=vec4(col, 1.-smoothstep(0.6,1.,r));
}`;

/* Castle Builder: sand heights under each flag (read back a few times a second) */
const FS_PROBE = COMMON + `
uniform sampler2D uA; uniform vec2 uPts[32];
out vec4 o;
void main(){
  int i=int(gl_FragCoord.x); vec2 q=uPts[i]; ivec2 c=ivec2(floor(q));
  vec4 s0=texelFetch(uA,cl(c),0); float hm=0.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++) hm=max(hm, texelFetch(uA,cl(c+ivec2(x,y)),0).x);
  o=vec4(s0.x, hm, min(s0.w,s0.x), 1.);
}`;
/* Flags: small lit triangles built on the CPU each frame (screen css px, linear colour; alpha<0 = shadow) */
const VS_FLAG = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
layout(location=0) in vec2 aP; layout(location=1) in vec4 aC;
uniform vec2 uScreen; out vec4 vC;
void main(){ gl_Position=vec4(aP.x/uScreen.x*2.-1., 1.-aP.y/uScreen.y*2., 0., 1.); vC=aC; }`;
const FS_FLAG = HDR + `
in vec4 vC; uniform float uExposure; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-0.055, step(vec3(0.0031308),c)); }
void main(){
  if(vC.a<0.){ o=vec4(0.,0.,0.,-vC.a); return; }
  o=vec4(srgb(aces(vC.rgb*uExposure)), vC.a);
}`;

/* ------------------------------------------------------------------ */
/* Garden items: each kind is generated once as a top-down "relief     */
/* sprite" (albedo, height spans, material) and lit live like the sand */
/* ------------------------------------------------------------------ */
/* Sprite texels, in item-local units (the sprite square is [-1,1]^2, heights in the same units):
   T0 = sqrt(albedo), coverage   T1 = top, bottom of the top span, top of the grounded part, translucency
   T2 = specular, roughness, baked occlusion, sheen */
const SPRITE_M = 0.04;   // margin inside each atlas slot so mips never bleed between items
const FS_SPRITE = HDR + `
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
layout(location=2) out vec4 o2;
uniform int uKind; uniform vec2 uOrg; uniform float uRes;
float h1(float n){ return fract(sin(n)*43758.5453123); }
float h2(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vn(vec2 x){ vec2 i=floor(x), f=x-i; f=f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 x){ float a=0.5, s=0.; for(int i=0;i<5;i++){ s+=a*vn(x); x=x*2.03+vec2(17.1,9.7); a*=0.5; } return s; }
// voronoi: x = distance to nearest feature, y = to second nearest, zw = nearest cell id
vec4 vor(vec2 x, float jit){
  vec2 n=floor(x), f=x-n; float d1=8., d2=8.; vec2 id=vec2(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g=vec2(i,j); vec2 o=0.5+jit*(h22(n+g)-0.5); vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=n+g; } else if(d<d2) d2=d;
  }
  return vec4(sqrt(d1), sqrt(d2), id);
}
vec2 rot(vec2 p, float a){ float c=cos(a), s=sin(a); return vec2(c*p.x+s*p.y, -s*p.x+c*p.y); }
vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }

// output of one item at one texel
vec3 ALB; float COV, TOP, BOT, GRD, SSS, SPEC, ROUGH, AO, SHEEN;
void clearOut(){ ALB=vec3(0.); COV=0.; TOP=0.; BOT=0.; GRD=0.; SSS=0.; SPEC=0.; ROUGH=1.; AO=1.; SHEEN=0.; }

/* ---- three large river stones, polished smooth by water ---- */
void stones(vec2 q, float px){
  vec2 C[3]; vec2 R[3]; float A[3]; float H[3]; float L[3]; vec3 T[3];
  C[0]=vec2(-0.30,0.20); R[0]=vec2(0.47,0.33); A[0]=0.50;  H[0]=0.25; L[0]=0.00; T[0]=vec3(0.36,0.36,0.35);
  C[1]=vec2(0.31,0.05);  R[1]=vec2(0.45,0.31); A[1]=-0.70; H[1]=0.27; L[1]=0.035; T[1]=vec3(0.30,0.30,0.30);
  C[2]=vec2(-0.03,-0.43);R[2]=vec2(0.37,0.26); A[2]=0.12;  H[2]=0.21; L[2]=0.00; T[2]=vec3(0.41,0.40,0.38);
  float best=-1., be=9., cov=0.; int bi=0; float crease=0.;
  float hs[3]; float es[3];
  for(int i=0;i<3;i++){
    vec2 p=rot(q-C[i], A[i]);
    float th=atan(p.y,p.x);
    float e=length(p/R[i]);
    e*=1.+0.035*sin(3.*th+float(i)*1.7)+0.02*sin(5.*th+float(i)*4.1)+0.012*sin(7.*th+float(i));
    es[i]=e;
    float hh = e<1. ? L[i]+H[i]*pow(max(1.-pow(e,2.4),0.),0.58) : -1.;
    hs[i]=hh;
    cov=max(cov, clamp((1.-e)*min(R[i].x,R[i].y)/px+0.5,0.,1.));
    if(hh>best){ best=hh; bi=i; be=e; }
  }
  if(best<0.){ clearOut(); return; }
  // the stone underneath darkens where another stone rests on it
  // contact crease: a stone is darker just outside the outline of a neighbour pressed against it
  for(int i=0;i<3;i++){ if(i==bi) continue; if(es[i]>=1.) crease=max(crease, 1.-smoothstep(1.,1.16,es[i])); }
  vec2 p=rot(q-C[bi], A[bi])+float(bi)*3.17;
  // very fine pitting and a hint of tumbling facets
  float micro=fbm(p*38.)-0.5, pit=smoothstep(0.70,0.86,vn(p*95.));
  TOP=best+0.0009*micro-0.0007*pit+0.004*(fbm(p*4.)-0.5);
  BOT=0.; GRD=TOP;
  vec3 c=T[bi];
  c*=0.88+0.22*fbm(p*3.1);                       // cloudy tone
  c*=0.93+0.10*vn(p*22.);
  float speck=step(0.965,h2(floor(p*180.)));     // pale feldspar flecks
  c=mix(c, vec3(0.62,0.61,0.58), speck*0.65);
  float dark=step(0.975,h2(floor(p*150.)+7.));
  c=mix(c, vec3(0.14), dark*0.6);
  // a thin quartz vein wrapping one stone
  if(bi==0){ float v=abs(dot(p-vec2(3.17),normalize(vec2(0.8,0.6)))+0.06+0.04*(fbm(p*5.)-0.5)); c=mix(c, vec3(0.78,0.77,0.73), 1.-smoothstep(0.006,0.016,v)); }
  if(bi==2){ float v=abs(dot(p-vec2(6.34),normalize(vec2(-0.3,1.)))-0.08+0.05*(fbm(p*4.)-0.5)); c=mix(c, vec3(0.70,0.69,0.66), 0.8*(1.-smoothstep(0.004,0.011,v))); }
  ALB=lin(c); COV=cov;
  SSS=0.; SPEC=0.6-0.3*pit; ROUGH=0.34+0.08*micro+0.25*pit; SHEEN=0.;
  AO=(1.-0.55*crease)*mix(0.72,1.,smoothstep(0.,0.6,1.-be));
}

/* ---- granite garden lantern (kasuga style), seen from above: roof, hip ridges, jewel finial ---- */
float hexR(vec2 p){ // hexagon "radius": 1 on the edge midpoints
  p=abs(p); return max(p.x*0.8660254+p.y*0.5, p.y);
}
void lantern(vec2 q, float px){
  vec2 p=rot(q, 0.2618);
  float rh=mix(hexR(p), length(p)*0.93, 0.3)/0.86; // 0 at centre, 1 at the eave (softened hexagon)
  float th=atan(p.y,p.x);
  float sec=mod(th+0.5236, 1.0472)-0.5236;       // angle from the nearest corner (hip) line
  float corner=1.-smoothstep(0.,0.22,abs(sec));
  // corners curl up a little at the eave
  float tip=corner*smoothstep(0.82,1.0,rh);
  float eave=1.0+0.035*tip;
  float cov=clamp((eave-rh)*0.86/px+0.5,0.,1.);
  if(rh>eave+3.*px){ clearOut(); return; }
  float eaveTop=1.62, peak=2.02;
  // concave sweep up to the peak, a raised hip ridge along each corner
  float u_=max(1.-rh,0.);
  float roof=eaveTop+(peak-eaveTop)*mix(pow(u_,1.9), 1.-pow(1.-u_,2.2)*0.98, 0.25);
  roof+=0.035*(1.-smoothstep(0.,0.06,abs(sec)*rh))*smoothstep(0.15,0.3,rh)*(1.-smoothstep(0.92,1.,rh));
  roof+=0.10*tip;
  // the eave edge: a rounded lip
  roof-=0.06*smoothstep(0.93,1.0,rh);
  float r=length(p);
  float h=roof;
  float fin=0.;
  // finial: a round collar, then the onion-shaped jewel with a point
  if(r<0.22){ h=max(h, 2.08+0.03*sqrt(max(1.-r*r/0.0484,0.))); fin=max(fin,0.5); }
  if(r<0.165){ float t=r/0.165; h=max(h, 2.14+0.24*pow(max(1.-t*t,0.),0.55)+0.07*pow(max(1.-t,0.),3.)); fin=1.; }
  float grain=fbm(p*14.);
  h+=0.010*(grain-0.5)+0.004*(vn(p*60.)-0.5)-0.006*smoothstep(0.6,0.8,vn(p*30.+4.));
  TOP=h;
  // spans: the roof floats above the narrower fire box and post (light passes beneath the eaves)
  BOT = r<0.20 ? 0. : (rh<0.48 ? 0.98 : 1.48);
  GRD = r<0.20 ? h : (rh<0.66 ? 0.46 : 0.);       // pedestal around the post
  // granite: grey with black mica and white feldspar specks, darker grime, pale lichen, a little moss
  vec3 c=vec3(0.50,0.49,0.47)*(0.82+0.3*fbm(p*4.+3.));
  float s1=step(0.93,h2(floor(p*150.))), s2=step(0.95,h2(floor(p*120.)+31.));
  c=mix(c, vec3(0.16,0.16,0.17), s1*0.75); c=mix(c, vec3(0.86,0.85,0.82), s2*0.6);
  float grime=smoothstep(0.4,0.8,fbm(p*3.+11.))*(0.4+0.6*smoothstep(0.55,0.95,rh));
  c*=1.-0.45*grime;
  c*=1.-0.3*(1.-smoothstep(0.,0.07,abs(sec)*rh))*smoothstep(0.25,0.5,rh);   // rain streaks darken the hips
  float lich=smoothstep(0.62,0.72,fbm(p*6.+27.))*(1.-fin);
  c=mix(c, vec3(0.70,0.71,0.55), lich*0.7);
  float moss=smoothstep(0.66,0.76,fbm(p*9.+5.))*smoothstep(0.75,0.97,rh)*(1.-fin);
  c=mix(c, vec3(0.25,0.33,0.10), moss*0.85);
  ALB=lin(c); COV=cov;
  SPEC=0.18+0.15*fin; ROUGH=0.85-0.3*fin; SSS=0.; SHEEN=0.;
  // crevice under the finial, eave lip shading
  AO=1.-0.35*(smoothstep(0.30,0.2,r)*smoothstep(0.16,0.2,r)) - 0.15*smoothstep(0.96,1.,rh);
}

/* ---- moss mound: a dense dome of fine blades ---- */
void moss(vec2 q, float px){
  float th=atan(q.y,q.x);
  float e=length(q)/0.80;
  e*=1.+0.05*sin(3.*th+1.)+0.035*sin(5.*th+2.3)+0.02*sin(9.*th+0.4);
  float dome=0.56*pow(max(1.-e*e,0.),0.62);
  // blades: small tufts that lean outward, stretched along the radius
  // tufts of fine blades at two scales, each blade cluster a little spike
  vec2 w=q+0.012*vec2(vn(q*40.),vn(q*40.+9.));
  vec4 v=vor(w*70., 1.);
  float tuft=pow(max(1.-v.x*1.15,0.),1.4);
  vec4 v2=vor(w*150.+13., 1.);
  float fine=pow(max(1.-v2.x*1.25,0.),1.8);
  vec4 v3=vor(w*300.+29., 1.);
  float hair=pow(max(1.-v3.x*1.3,0.),2.);
  float blade=0.45*tuft+0.35*fine+0.2*hair;
  // the fuzzy rim: blades poke out past the dome
  float rim=smoothstep(1.06,0.93,e-0.08*blade);
  if(rim<=0.001 && e>1.12){ clearOut(); return; }
  float h=dome+0.022*blade*rim+0.008*(fbm(q*7.)-0.5);
  TOP=max(h,0.);
  BOT=0.; GRD=TOP;
  float tone=fbm(q*5.+4.);
  vec3 deep=vec3(0.10,0.20,0.04), mid=vec3(0.33,0.55,0.10), tipc=vec3(0.62,0.78,0.26);
  vec3 c=mix(deep, mid, smoothstep(0.05,0.5,blade));
  c=mix(c, tipc, smoothstep(0.5,0.95,blade)*0.75);
  c*=0.85+0.3*tone;
  c=mix(c, vec3(0.40,0.38,0.16), smoothstep(0.68,0.8,fbm(q*6.+21.))*0.55);   // a few drier, browner patches
  ALB=lin(c); COV=rim;
  SPEC=0.08; ROUGH=0.95; SSS=0.55; SHEEN=0.6;
  AO=mix(0.5,1.,smoothstep(0.,0.7,blade))*mix(0.7,1.,smoothstep(0.,0.25,dome));
}

/* ---- cherry blossom tree on a weathered rock, seen from above ---- */
void tree(vec2 q, float px){
  float best=-1.; float bot=0.; float cov=0.; vec3 c=vec3(0.); float sss=0., spec=0.1, rough=0.8, ao=1.;
  // blossom clumps: domes covered in small flowers
  float clT=-1.; int ci=-1; float cd=9., cr=1., cz=0.;
  for(int i=0;i<15;i++){
    float fi=float(i);
    float a=fi*2.39996+0.7, rr = i==0 ? 0.0 : 0.18+0.46*sqrt(h1(fi*7.13+1.));
    vec2 cc=vec2(cos(a),sin(a))*rr;
    float r=0.20+0.10*h1(fi*3.7+2.)-0.06*rr;
    float z=1.18+0.16*h1(fi*5.1+3.)-0.18*rr*rr;
    vec2 d=q-cc;
    float dd=length(d)/r;
    // flowers make the clump outline lumpy
    dd*=1.+0.06*(vn(q*28.+fi*3.)-0.5)*2.;
    if(dd<1.){
      float hz=z+0.62*r*sqrt(1.-dd*dd);
      if(hz>clT){ clT=hz; ci=i; cd=dd; cr=r; cz=z; }
    }
    cov=max(cov, clamp((1.-dd)*r/px+0.5,0.,1.));
  }
  // branches, seen through gaps in the blossom
  float br=-1., brc=0.;
  for(int i=1;i<15;i++){
    float fi=float(i);
    float a=fi*2.39996+0.7, rr=0.18+0.46*sqrt(h1(fi*7.13+1.));
    vec2 cc=vec2(cos(a),sin(a))*rr*0.9;
    vec2 bend=vec2(-cc.y,cc.x)*0.12*(h1(fi*9.3)-0.5);
    vec2 pa=vec2(0.), pb=cc;
    float t=clamp(dot(q,pb)/dot(pb,pb),0.,1.);
    vec2 pt=pb*t+bend*sin(t*3.1416);
    float d=length(q-pt);
    float w=0.034*(1.-0.6*t)+0.008;
    if(d<w){ float hz=0.95+0.18*t+0.02*sqrt(1.-d*d/(w*w)); if(hz>br){ br=hz; brc=d/w; } }
    cov=max(cov, clamp((w-d)/px+0.5,0.,1.)*step(0.,br));
  }
  // trunk top and the rock it grows from
  float rk=length(q*vec2(1.,1.25)+vec2(0.03,0.))/0.36;
  rk*=1.+0.12*(fbm(q*6.)-0.5);
  float rock = rk<1. ? 0.17*pow(1.-rk*rk,0.4)+0.02*(fbm(q*25.)-0.5) : -1.;
  float trunkR=length(q)/0.075;
  float trunk = trunkR<1. ? 1.00+0.02*sqrt(1.-trunkR*trunkR) : -1.;
  cov=max(cov, clamp((1.-rk)*0.36/px+0.5,0.,1.));
  // pick what is visible from above
  float top=max(max(clT,br),max(rock,trunk));
  if(top<0.){ clearOut(); return; }
  if(clT>=top-1e-5 && ci>=0){
    // flowers: five rounded petals around a deeper pink centre with pale stamens
    // two layers of flowers so the clumps read as dense blossom, with the odd gap
    float inF=0., lift=0., fr=1., petal=1.; vec2 cid=vec2(0.); float bud=0.;
    for(int L=0;L<2;L++){
      vec2 fq=q*(L==0?15.:22.)+float(L)*7.3;
      vec4 v=vor(fq, 0.9);
      vec2 id=v.zw; vec2 fo=0.5+0.9*(h22(id)-0.5);
      vec2 rel=fq-(id+fo);
      float r_=length(rel), fa=atan(rel.y,rel.x)+h1(dot(id,vec2(7.1,3.3)))*6.28;
      float pt=0.58*(0.80+0.20*cos(5.*fa))-0.07*pow(abs(cos(2.5*fa)),30.);
      float b_=h2(id+5.+float(L)*3.);
      float f=1.-smoothstep(pt-0.07,pt+0.02,r_);
      if(b_>0.9) f=0.;
      float lf=f*(0.016*(1.-r_/pt*0.5))+float(1-L)*0.006*f;
      if(lf>lift || (f>0.5 && inF<0.5)){ lift=lf; fr=r_; petal=pt; cid=id; bud=b_; }
      inF=max(inF,f);
    }
    float shade=smoothstep(1.,0.55,cd);
    best=clT+lift-0.015*(1.-inF);
    vec3 pet=mix(vec3(1.0,0.90,0.93), vec3(0.97,0.70,0.80), 0.25+0.6*h2(cid+1.));
    pet=mix(pet, vec3(0.88,0.42,0.58), (1.-smoothstep(0.06,0.24,fr))*0.75);
    float stamen=step(fr,0.13)*step(0.55,h2(floor(vec2(fr*30.,0.))+cid));
    pet=mix(pet, vec3(0.96,0.86,0.60), stamen*0.5);
    vec3 under=mix(vec3(0.82,0.55,0.62), vec3(0.42,0.44,0.22), step(0.97,h2(floor(q*40.))));
    c=mix(under, pet, inF);
    sss=0.55*inF+0.2; spec=0.08; rough=0.8;
    ao=mix(0.72,1.,inF)*mix(0.55,1.,shade);
    bot=cz-0.55*cr;
  } else if(br>=top-1e-5){
    best=br; c=mix(vec3(0.30,0.20,0.15), vec3(0.50,0.45,0.40), smoothstep(0.55,0.8,vn(q*60.))*0.6)*(0.7+0.3*(1.-brc)); bot=br-0.05; sss=0.; spec=0.06; rough=0.85; ao=0.6+0.4*(1.-brc*brc);
  } else if(trunk>=top-1e-5){
    best=trunk; c=vec3(0.24,0.16,0.12)*(0.8+0.3*vn(q*90.)); bot=0.; sss=0.; spec=0.06; rough=0.85; ao=0.8;
  } else {
    // layered, weathered rock (like the slabs in desk zen gardens)
    best=rock; float lay=sin((q.x*0.6+q.y)*70.+fbm(q*8.)*6.);
    c=mix(vec3(0.33,0.21,0.14), vec3(0.50,0.34,0.24), 0.5+0.5*lay)*(0.8+0.3*fbm(q*12.));
    bot=0.; sss=0.; spec=0.1; rough=0.8; ao=0.55+0.45*smoothstep(0.,0.6,1.-rk);
  }
  TOP=best; BOT=bot;
  GRD = trunkR<1. ? max(trunk,best) : (rk<1. ? max(rock,0.) : 0.);
  if(clT>=top-1e-5 && ci>=0) {} else if(trunkR<1. || rk<1.) BOT=0.;
  ALB=lin(c); COV=cov; SSS=sss; SPEC=spec; ROUGH=rough; AO=ao; SHEEN=0.;
}

void main(){
  vec2 t=(gl_FragCoord.xy-uOrg)/uRes;
  vec2 q=(t*2.-1.)/(1.-2.*${SPRITE_M});
  float px=2./(uRes*(1.-2.*${SPRITE_M}));
  clearOut();
  if(uKind==0) stones(q,px); else if(uKind==1) lantern(q,px); else if(uKind==2) moss(q,px); else tree(q,px);
  o0=vec4(sqrt(clamp(ALB,0.,1.)), COV);
  o1=vec4(TOP, BOT, GRD, SSS);
  o2=vec4(SPEC, ROUGH, AO, SHEEN);
}`;

/* Items, drawn as instanced quads. Per instance: I0 = centre (natural css px), cos, sin of rotation;
   I1 = half size (px), atlas slot (x,y), lift (px);  I2 = opacity, wall on/off, height scale, mode */
const VS_ITEM = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform vec4 uI0[24], uI1[24], uI2[24];
uniform int uPass;              // 0 = screen, 1 = sim-resolution occlusion map, 2 = thumbnail
uniform vec2 uR0, uR1, uROff, uScreen; uniform float uCs; uniform ivec2 uN;
uniform sampler2D uSV;          // sand surface (height in cells); its own name, so no uniform is shared with the fragment stage (strict mobile linkers)
out vec2 vLocal; out vec2 vNat;
flat out vec4 vI0; flat out vec4 vI1; flat out vec4 vI2; flat out float vBase;
void main(){
  int i=gl_InstanceID;
  vec4 I0=uI0[i], I1=uI1[i], I2=uI2[i];
  int k=gl_VertexID; vec2 c=vec2(k==1||k==2||k==4 ? 1. : -1., k==2||k==4||k==5 ? 1. : -1.);
  vLocal=c;
  vec2 nat=I0.xy+vec2(I0.z*c.x-I0.w*c.y, I0.w*c.x+I0.z*c.y)*I1.x;
  vNat=nat;
  // the item rests on the sand below it: average height over its middle
  float b=0.;
  if(uPass!=2){
    vec2 sz=vec2(uN);
    float r=I1.x*0.3/uCs; vec2 cc=I0.xy/uCs;
    b=textureLod(uSV,cc/sz,0.).x*2.+textureLod(uSV,(cc+vec2(r,0))/sz,0.).x+textureLod(uSV,(cc-vec2(r,0))/sz,0.).x
     +textureLod(uSV,(cc+vec2(0,r))/sz,0.).x+textureLod(uSV,(cc-vec2(0,r))/sz,0.).x;
    b=b/6.*uCs;
  }
  vBase=b;
  vI0=I0; vI1=I1; vI2=I2;
  if(uPass==0){
    vec2 d=nat-uROff;
    vec2 sc=vec2(uR0.x*d.x+uR1.x*d.y, uR0.y*d.x+uR1.y*d.y);
    gl_Position=vec4(sc.x/uScreen.x*2.-1., 1.-sc.y/uScreen.y*2., 0., 1.);
  } else if(uPass==1){
    vec2 cell=nat/uCs;
    gl_Position=vec4(cell/vec2(uN)*2.-1., 0., 1.);
  } else {
    gl_Position=vec4(c.x, -c.y, 0., 1.)*vec4(I2.w, I2.w, 1., 1.);
  }
}`;
const ITEM_COMMON = HDR + `
in vec2 vLocal; in vec2 vNat;
flat in vec4 vI0; flat in vec4 vI1; flat in vec4 vI2; flat in float vBase;
uniform sampler2D uT0, uT1, uT2;
vec2 atlasUV(vec2 l){ return (vI1.yz*512. + ((l*(1.-2.*${SPRITE_M}))*0.5+0.5)*512.)/1024.; }
`;
/* Occlusion map at sim resolution: x = top of the topmost span, y = -bottom, z = wall, w = grounded top (cells) */
const FS_OBJ = ITEM_COMMON + `
uniform float uCs; uniform float uWallMin;
out vec4 o;
void main(){
  if(any(greaterThan(abs(vLocal),vec2(1.)))) discard;
  vec2 uv=atlasUV(vLocal);
  float cov=texture(uT0,uv).a;
  if(cov<0.5) discard;
  vec4 t1=texture(uT1,uv);
  float hs=vI1.x*vI2.z*vI2.x, lift=vI1.w;
  float top=vBase+lift+t1.x*hs, bot=vBase+lift+t1.y*hs, grd=t1.z*hs;
  float wall = (vI2.y>0.5 && grd>uWallMin) ? 1. : 0.;
  float g = (lift<0.5 && grd>0.05) ? vBase+grd : 0.;
  if(lift>=0.5 && grd>0.05) bot=vBase+lift;     // lifted: the grounded part floats with the rest
  o=vec4(top/uCs, -bot/uCs, wall, g/uCs);
}`;
/* Screen pass: light the relief sprite with the room lamp (same lamp, sky, exposure as the sand) */
const FS_ITEM = ITEM_COMMON + OBJOCC + `
uniform int uPass; uniform ivec2 uN; uniform float uCs, uExposure, uTime;
uniform sampler2D uS, uObj; uniform int uHasObj;
uniform vec3 uL, uSun, uSky; uniform vec2 uCanvas;
out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-0.055, step(vec3(0.0031308),c)); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float topAt(vec2 l){ return texture(uT1, atlasUV(l)).x; }
void main(){
  vec2 l=vLocal;
  if(any(greaterThan(abs(l),vec2(1.)))) discard;
  vec2 uv=atlasUV(l);
  vec4 t0=texture(uT0,uv);
  float cov=t0.a*vI2.x;
  if(cov<0.004) discard;
  vec4 t1=texture(uT1,uv), t2=texture(uT2,uv);
  float half_=vI1.x, hsc=vI2.z, lift=vI1.w;
  float hs=half_*hsc;
  float surf=vBase+lift+t1.x*hs;                 // absolute height of this point (px)
  vec2 sz=vec2(uN);
  if(uPass==0){
    // sand heaped against the item covers its lower edge (tested against the smoothed relief so
    // fine detail like moss blades doesn't let sand speckle through)
    float sand=texture(uS, vNat/uCs/sz).x*uCs;
    float surfS=vBase+lift+textureLod(uT1,uv,3.).x*hs;
    cov*=clamp((surfS+1.2-sand)/2.4,0.,1.);
    if(cov<0.004) discard;
  }
  // normal from the relief (local frame), rotated into the tray frame
  float e=1.5/512.;
  float hx=(topAt(l+vec2(e,0))-topAt(l-vec2(e,0)))/(2.*e)*hsc;
  float hy=(topAt(l+vec2(0,e))-topAt(l-vec2(0,e)))/(2.*e)*hsc;
  vec2 gL=vec2(hx,hy); float glen=length(gL); if(glen>6.) gL*=6./glen;
  float cs_=vI0.z, sn=vI0.w;
  vec2 gN=vec2(cs_*gL.x-sn*gL.y, sn*gL.x+cs_*gL.y);
  vec3 N=normalize(vec3(-gN,1.));
  vec3 L=normalize(uL);
  // fine self-shadowing, marched through the sprite's own relief
  vec2 lN=L.xy/max(length(L.xy),1e-4);
  vec2 lL=vec2(cs_*lN.x+sn*lN.y, -sn*lN.x+cs_*lN.y);   // light direction in local units
  float rise=L.z/max(length(L.xy),1e-4)/hsc;            // local height per local unit travelled
  float h0=t1.x, sh=1., t=0.012;
  for(int i=0;i<18;i++){
    vec2 s=l+lL*t;
    if(any(greaterThan(abs(s),vec2(1.)))) break;
    float hq=textureLod(uT1, atlasUV(s), 1.).x;
    sh=min(sh, clamp(0.5+(h0+t*rise-hq)/(0.05*t*rise+0.01),0.,1.));
    t*=1.32; t+=0.006;
  }
  // coarse shadows from other items and from sand (castles), outside this item's own square
  if(uPass==0){
    vec2 p=vNat/uCs; float zc=surf/uCs;
    vec2 d=lN; float rz=L.z/max(length(L.xy),1e-4);
    // distance (cells) for the ray to leave this item's bounding circle
    vec2 oc=(vNat-vI0.xy)/uCs; float R=half_*1.42/uCs;
    float bq=dot(oc,d), cq=dot(oc,oc)-R*R; float tx=-bq+sqrt(max(bq*bq-cq,0.));
    float tt=max(tx,0.6);
    for(int i=0;i<20;i++){
      vec2 q=p+d*tt;
      if(q.x<0.||q.y<0.||q.x>sz.x||q.y>sz.y) break;
      float ray=zc+tt*rz;
      float hsand=textureLod(uS,q/sz,0.).x;
      sh=min(sh, clamp(0.5+(ray-hsand)/(0.16*tt+0.22),0.,1.));
      if(uHasObj==1) sh=min(sh, 1.-objOcc(textureLod(uObj,q/sz,0.), ray, 0.35+0.07*tt));
      if(sh<0.01) break;
      tt += 0.6+tt*0.12;
    }
  }
  vec3 alb=t0.rgb*t0.rgb;
  float spec=t2.x, rough=max(t2.y,0.08), ao=t2.z, sheen=t2.w, sss=t1.w;
  float nl=max(dot(N,L),0.);
  // rough diffuse (as for the sand)
  float nv=max(N.z,0.); float sg=rough*0.6;
  float s_=L.z-nl*nv; float tq= s_>0. ? max(max(nl,nv),1e-3) : 1.;
  float diff=nl*(1.+sg*s_/tq)/(1.+0.2879*sg);
  // translucent petals and moss blades glow on the lit side and wrap light around
  float wrap=max((dot(N,L)+0.6)/1.6,0.);
  diff=mix(diff, wrap*0.85, sss*0.6);
  // specular: GGX, viewer straight above
  vec3 H=normalize(L+vec3(0,0,1));
  float a2=rough*rough*rough*rough; float nh=max(dot(N,H),0.);
  float D=a2/(3.14159*pow(nh*nh*(a2-1.)+1.,2.));
  float F=0.04+0.96*pow(1.-max(dot(H,L),0.),5.);
  float G=nl/(nl*(1.-rough*0.5)+rough*0.5+1e-4);
  float spc=D*F*G*0.25*spec*2.;
  // sky and fill: the sky is mostly above; ambient sees the baked crevices
  vec3 col = alb*uSun*diff*sh + uSun*spc*sh
           + alb*uSky*(0.55+0.45*N.z)*ao*1.1
           + alb*uSun*sss*0.10*sh*(1.-nl)*ao;
  // velvety sheen on moss: brighter at grazing angles to the lamp
  col += alb*uSun*sheen*0.12*pow(1.-nv,2.)*sh;
  col*=mix(1.,ao,0.35);
  if(uPass==0){ vec2 vq=gl_FragCoord.xy/uCanvas-0.5; col*=1.-0.22*dot(vq,vq); }
  col=srgb(aces(col*uExposure));
  col+=(hash12(gl_FragCoord.xy+fract(uTime)*91.)-0.5)/255.;
  o=vec4(col, clamp(cov,0.,1.));
}`;

let progs;
try{
  progs = {
    tool:program(FS_TOOL), vel:program(FS_VEL), k:program(FS_K), h:program(FS_H), t:program(FS_T),
    surf:program(FS_SURF), light:program(FS_LIGHT), reduce:program(FS_REDUCE),
    grain:program(FS_GRAIN), grainN:program(FS_GRAINN), final:program(FS_FINAL),
    part:program(FS_PART, VS_PART), pack:program(FS_PACK),
    sprite:program(FS_SPRITE), obj:program(FS_OBJ, VS_ITEM), item:program(FS_ITEM, VS_ITEM),
    probe:program(FS_PROBE), flag:program(FS_FLAG, VS_FLAG),
    wflux:program(FS_WFLUX), wdepth:program(FS_WDEPTH),
  };
}catch(e){ fail('The sand simulation failed to start on this device: '+e.message); return; }

/* ------------------------------------------------------------------ */
/* Grain texture (generated once)                                      */
/* ------------------------------------------------------------------ */
const GT = 1024;
const grain0 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
const grain1 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
const grain2 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
{
  const f=fbo([grain0,grain1]);
  run(progs.grain, f, u=>{ gl.uniform1f(u.uSize,GT); });
  gl.bindTexture(gl.TEXTURE_2D,grain0); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  const f2=fbo([grain2]);
  run(progs.grainN, f2, u=>{ bindTex(progs.grainN,'uG',0,grain0); gl.uniform1f(u.uSize,GT); });
  for(const t of [grain0,grain1,grain2]){ gl.bindTexture(gl.TEXTURE_2D,t); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.generateMipmap(gl.TEXTURE_2D); }
  // grain1 holds random ids: keep its mips from blending ids too much
  gl.bindTexture(gl.TEXTURE_2D,grain1); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST_MIPMAP_NEAREST);
}
// Look of the scene: a warm lamp fixed in the room, a dim cool fill from the room, linear values
const LOOK = {
  elev: 27,                     // lamp elevation, degrees (low enough to rake the relief)
  azim: [-0.62,-0.78],          // lamp direction in the tray plane when the phone lies flat
  sun: [1.0*3.0, 0.90*3.0, 0.77*3.0],
  sky: [0.36*0.55, 0.39*0.55, 0.45*0.55],
  exposure: 0.64,
  grainScale: 1.9,              // grain texture px per css px (one grain ~2.5 css px, ~0.4 mm)
};

/* ------------------------------------------------------------------ */
/* Simulation state                                                    */
/* ------------------------------------------------------------------ */
let NX=0, NY=0, cs=3, vw=0, vh=0, angle=0, natW=0, natH=0;
let A=[], B=[], Kt, ToolT, SurfA, SurfB, RedT, ObjT, WatT, WD=[], WF=[], fWD=[], fWF=[];
let fA=[], fB=[], fK, fTool, fSurfA, fSurfB, fRed, fObj;
let cells = {}; // tunables in cells
const RED=16;
let pbo=gl.createBuffer(), fence=null, redData=new Float32Array(RED*RED*4);
// STREAM_COPY, not *_READ: Chrome shadows READ-usage buffers and, with a buffer re-filled every few
// frames, discarded that shadow each time (the "written, then fenced, but written again" warning).
// The fence below still guarantees the GPU is done before getBufferSubData, so the read never stalls.
gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo); gl.bufferData(gl.PIXEL_PACK_BUFFER,redData.byteLength,gl.STREAM_COPY); gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);

function getAngle(){
  let a = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : (typeof window.orientation==='number' ? window.orientation : 0);
  return ((a%360)+360)%360;
}
// screen css -> natural css mapping
let R0=[1,0], R1=[0,1], ROFF=[0,0];
function setMapping(){
  if(!isTouch) angle=0;
  if(angle===90){ R0=[0,-1]; R1=[1,0]; ROFF=[vh,0]; }
  else if(angle===180){ R0=[-1,0]; R1=[0,-1]; ROFF=[vw,vh]; }
  else if(angle===270){ R0=[0,1]; R1=[-1,0]; ROFF=[0,vw]; }
  else { R0=[1,0]; R1=[0,1]; ROFF=[0,0]; }
}
function toNat(sx,sy){ return [R0[0]*sx+R0[1]*sy+ROFF[0], R1[0]*sx+R1[1]*sy+ROFF[1]]; }

function initialHeights(nx,ny,c){
  // A freshly levelled tray: broad, gentle unevenness at several scales (as left by smoothing the sand
  // with a flat hand) down to fine grain-scale roughness.
  // Lengths in css px; slopes stay well below the angle of repose so nothing moves at rest.
  const data=new Float32Array(nx*ny*4);
  const h0=P.depthPx*trayDepth()/c;
  const rnd=mulberry((Math.random()*4294967296)>>>0);
  const lat=new Float32Array(256); for(let i=0;i<256;i++) lat[i]=rnd()*2-1;
  const perm=new Uint8Array(512); for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[256+i]=perm[i];
  const vn=(x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y); let fx=x-xi, fy=y-yi;
    fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
    const g=(i,j)=>lat[perm[(perm[(xi+i)&255]+yi+j)&255]];
    const a=g(0,0)+(g(1,0)-g(0,0))*fx, b=g(0,1)+(g(1,1)-g(0,1))*fx; return a+(b-a)*fy; };
  // octaves: [wavelength px, amplitude px]
  const oct=[[320,4.6],[140,3.2],[60,1.6],[26,0.5],[11,0.14]];
  for(let y=0;y<ny;y++) for(let x=0;x<nx;x++){
    const px=x*c, py=y*c;
    let e=0;
    oct.forEach(([w,a],k)=>{ e+=a*vn(px/w+k*17.3, py/w-k*9.1); });
    const i=(y*nx+x)*4; data[i]=h0+e/c; data[i+1]=0; data[i+2]=0; data[i+3]=0;
  }
  return data;
}
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function allocSim(nx,ny,initData){
  [...A,...B,Kt,ToolT,SurfA,SurfB,RedT,ObjT,WatT,...WD,...WF].forEach(t=>t&&gl.deleteTexture(t));
  [...fA,...fB,fK,fTool,fSurfA,fSurfB,fRed,fObj,...fWD,...fWF].forEach(f=>f&&gl.deleteFramebuffer(f));
  A=[0,1].map(i=>tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE, i===0?initData:null));
  B=[0,1].map(()=>tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE,new Float32Array(nx*ny*4)));
  Kt=tex(nx,ny,gl.R32F,gl.RED,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE);
  ToolT=tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE);
  SurfA=tex(nx,ny,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,MIPLIN,gl.CLAMP_TO_EDGE);
  SurfB=tex(nx,ny,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,LINEAR,gl.CLAMP_TO_EDGE);
  RedT=tex(RED,RED,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE);
  ObjT=tex(nx,ny,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,MIPLIN,gl.CLAMP_TO_EDGE);
  WatT=tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE);
  WD=[0,1].map(()=>tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE,new Float32Array(nx*ny*4)));
  WF=[0,1].map(()=>tex(nx,ny,gl.RGBA32F,gl.RGBA,gl.FLOAT,NEAREST,gl.CLAMP_TO_EDGE,new Float32Array(nx*ny*4)));
  fWD=WD.map(t=>fbo([t])); fWF=WF.map(t=>fbo([t]));
  fA=A.map(t=>fbo([t])); fB=B.map(t=>fbo([t])); fK=fbo([Kt]); fTool=fbo([ToolT]);
  fSurfA=fbo([SurfA]); fSurfB=fbo([SurfB]); fRed=fbo([RedT]); fObj=fbo([ObjT]);
  objWas=true; // clear the new occlusion map on the next frame
}

function computeCells(){
  cells.h0=P.depthPx/cs; cells.fingerR=P.fingerRPx/cs; cells.fingerZ=P.fingerZPx/cs;
  cells.rakeR=P.rakeRPx/cs; cells.rakeGap=P.rakeGapPx/cs; cells.smoothR=P.smoothRPx/cs; cells.pourR=P.pourRPx/cs;
  cells.hmax=cells.h0*5.0; cells.layer=P.layerPx/cs; cells.hthin=P.thinPx/cs;
  // physical gravity: 9.81 m/s^2 with 1 css px ~ 0.16 mm on phones, slowed a bit for readability
  cells.G = (isTouch? 9.81/(0.00016*cs) : 9.81/(0.00026*cs)) * 0.32 * P.gReal;
  cells.moatR=P.moatRPx*bScale()/cs; cells.moatZ=cells.h0*0.25; cells.wl=cells.moatZ+cells.h0*0.6;
}

function setup(keepState){
  vw=innerWidth; vh=innerHeight; angle=getAngle(); setMapping();
  if(isTouch && (angle===90||angle===270)){ natW=vh; natH=vw; } else { natW=vw; natH=vh; }
  const target = isTouch ? 42000 : 95000;
  let c=Math.max(2.6, Math.sqrt(natW*natH/target));
  const nx=Math.max(16,Math.round(natW/c)), ny=Math.max(16,Math.round(natH/c));
  c=natW/nx;
  const same = nx===NX && ny===NY;
  if(!(keepState && same)){
    let data=null;
    if(keepState && NX>0) data=resample(nx,ny,c);
    const old={NX,NY,cs};
    cs=c; NX=nx; NY=ny; computeCells();
    allocSim(NX,NY, data || initialHeights(NX,NY,cs));
    if(data&&data.B){ gl.bindTexture(gl.TEXTURE_2D,B[0]); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NX,NY,gl.RGBA,gl.FLOAT,data.B); }
    builderGridChanged(old, !!data);
  }
  resizeCanvas();
}
// Read back the current heights and resample them into a new grid (keeps the sand on resize)
function resample(nx,ny,c){
  wdOld = waterAny && fWD[0] ? readTex(fWD[0]) : null;
  const old=new Float32Array(NX*NY*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fA[0]); gl.readPixels(0,0,NX,NY,gl.RGBA,gl.FLOAT,old);
  const out=new Float32Array(nx*ny*4);
  const sx=NX/nx, sy=NY/ny, scaleH=cs/c;
  for(let y=0;y<ny;y++) for(let x=0;x<nx;x++){
    const ox=Math.min(NX-1,Math.floor((x+0.5)*sx)), oy=Math.min(NY-1,Math.floor((y+0.5)*sy));
    out[(y*nx+x)*4]=old[(oy*NX+ox)*4]*scaleH; out[(y*nx+x)*4+3]=old[(oy*NX+ox)*4+3]*scaleH;
  }
  return out;
}
function resizeCanvas(){
  const q=QUALITY[qi];
  const px=Math.max(1, DPR*q.rs);
  canvas.width=Math.round(vw*px); canvas.height=Math.round(vh*px);
  canvas._px=canvas.width/vw;
}

/* ------------------------------------------------------------------ */
/* Input: pointers become tools                                        */
/* ------------------------------------------------------------------ */
let tool='finger';
const pointers=new Map();
function newPointer(x,y,tl){ return {x,y,hist:[[x,y,x,y]],last:[x,y],vx:0,vy:0,t0:simTime,dir:[1,0],z:1,moved:0,tool:tl||null}; }
function cellPos(e){ const r=canvas.getBoundingClientRect(); const n=toNat(e.clientX-r.left, e.clientY-r.top); return [n[0]/cs, n[1]/cs]; }
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  noteInteraction();
  if(menuOpen){ openMenu(false); return; }          // a tap outside the garden menu just closes it
  const p=cellPos(e);
  if(castleMode){ firstInteraction(); placeCastle(p[0],p[1]); return; }
  if(builderDown(e,p)){ firstInteraction(); return; }
  if(grabItem(e)){ firstInteraction(); return; }
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,newPointer(p[0],p[1]));
  firstInteraction();
});
canvas.addEventListener('pointermove',e=>{
  if(builderMove(e)) return;
  if(moveGrab(e)) return;
  const pt=pointers.get(e.pointerId); if(!pt) return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  const p=cellPos(evs.length?evs[evs.length-1]:e); pt.x=p[0]; pt.y=p[1];
});
function endPointer(e){ builderUp(e); releaseGrab(e); const pt=pointers.get(e.pointerId); if(pt){ pointers.delete(e.pointerId); if(pt.tool==='moat') finishMoat(pt); } if(isTouch) requestMotionPermission(); }
canvas.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') builderHover(null); });
canvas.addEventListener('wheel',e=>{ if(builderWheel(e)) e.preventDefault(); },{passive:false});
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('touchend',()=>{ if(isTouch) requestMotionPermission(); },{passive:true}); // touchend is a user gesture on every iOS version
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{ if(e.target===canvas) e.preventDefault(); },{passive:false});

document.querySelectorAll('#bar .tool').forEach(b=>b.addEventListener('click',()=>{
  setCastleMode(false); noteInteraction(); if(menuOpen) openMenu(false); if(ribbonOpen) openRibbon(false);
  if(tool!==b.dataset.tool) analytics.track('tool_selected', {tool:b.dataset.tool, from:tool});
  tool=b.dataset.tool;
  document.querySelectorAll('#bar .tool').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b); });
  firstInteraction();
}));

/* Build tool segments for this frame */
const segA=new Float32Array(40*4), segB=new Float32Array(40*4), segC=new Float32Array(40*4);
const pourU=new Float32Array(6*4);
let segN=0, pourN=0, fingerEnergy=0;
function addSeg(ax,ay,bx,by,R,z,type,str,vx,vy){
  if(segN>=40) return; const i=segN*4;
  segA[i]=ax; segA[i+1]=ay; segA[i+2]=bx; segA[i+3]=by;
  segB[i]=R; segB[i+1]=z; segB[i+2]=type; segB[i+3]=str;
  segC[i]=vx; segC[i+1]=vy; segN++;
}
function buildTools(dt){
  segN=0; pourN=0; fingerEnergy=0;
  for(const pt of pointers.values()){
    const lx=pt.last[0], ly=pt.last[1];
    const dx=pt.x-lx, dy=pt.y-ly; const dist=Math.hypot(dx,dy);
    const ivx=dx/dt, ivy=dy/dt;
    pt.vx+= (ivx-pt.vx)*0.5; pt.vy+=(ivy-pt.vy)*0.5;
    pt.moved+=dist;
    if(dist>0.2){ const k=Math.min(1,dist/3); pt.dir=[pt.dir[0]*(1-k)+dx/dist*k, pt.dir[1]*(1-k)+dy/dist*k]; const l=Math.hypot(pt.dir[0],pt.dir[1])||1; pt.dir=[pt.dir[0]/l,pt.dir[1]/l]; }
    const age=simTime-pt.t0;
    const sp=Math.hypot(pt.vx,pt.vy);
    const tl=pt.tool||tool;
    if(tl==='moat'){
      // digging a moat: a wide, deep finger that leaves a smooth channel; the water comes in when it lifts
      pt.hist.unshift([lx,ly,pt.x,pt.y]); if(pt.hist.length>3) pt.hist.length=3;
      const plunge=Math.min(1, age/0.12);
      const z = cells.h0*1.6*(1-plunge)+cells.moatZ*plunge;
      for(const s of pt.hist) addSeg(s[0],s[1],s[2],s[3],cells.moatR,z,0,1,pt.vx*0.6,pt.vy*0.6);
      if(plunge>0.5) markMoat(pt, lx, ly, pt.x, pt.y);
      fingerEnergy+=Math.min(1,sp/120)*plunge;
    } else if(tl==='finger'||tl==='rake'){
      pt.hist.unshift([lx,ly,pt.x,pt.y]); if(pt.hist.length>3) pt.hist.length=3;
      const plunge=Math.min(1, age/0.09);
      if(tl==='finger'){
        const zt=cells.fingerZ; const z = cells.h0*1.25*(1-plunge)+zt*plunge;
        for(const s of pt.hist) addSeg(s[0],s[1],s[2],s[3],cells.fingerR,z,0,1,pt.vx,pt.vy);
        fingerEnergy+=Math.min(1,sp/120)*plunge;
      } else {
        const zt=cells.h0*P.rakeZFrac; const z = cells.h0*1.25*(1-plunge)+zt*plunge;
        const nx=-pt.dir[1], ny=pt.dir[0];
        for(let k=0;k<P.rakeN;k++){
          const o=(k-(P.rakeN-1)/2)*cells.rakeGap;
          for(let j=0;j<Math.min(2,pt.hist.length);j++){ const s=pt.hist[j]; addSeg(s[0]+nx*o,s[1]+ny*o,s[2]+nx*o,s[3]+ny*o,cells.rakeR,z,0,1,pt.vx,pt.vy); }
        }
        fingerEnergy+=Math.min(1,sp/120)*plunge*0.8;
      }
      if(sp>220 && Math.random()<Math.min(0.9,sp/900)) spray(pt, sp);
    } else if(tl==='smooth'){
      addSeg(lx,ly,pt.x,pt.y,cells.smoothR,0,1,1,pt.vx,pt.vy);
      fingerEnergy+=Math.min(1,sp/200)*0.6;
    } else if(tl==='pour'){
      if(pourN<6){ const i=pourN*4; pourU[i]=pt.x; pourU[i+1]=pt.y; pourU[i+2]=cells.pourR; pourU[i+3]=P.pourRate*Math.pow(cells.h0,3)*14; pourN++; }
      pourParticles(pt,dt);
      fingerEnergy+=0.25;
    }
    pt.last=[pt.x,pt.y];
  }
}

/* ------------------------------------------------------------------ */
/* Particles                                                           */
/* ------------------------------------------------------------------ */
const MAXP=2500; const parts=new Float32Array(MAXP*8); let np=0;
const partBuf=new Float32Array(MAXP*4);
const pvao=gl.createVertexArray(); const pbuf=gl.createBuffer();
gl.bindVertexArray(pvao); gl.bindBuffer(gl.ARRAY_BUFFER,pbuf); gl.bufferData(gl.ARRAY_BUFFER,partBuf.byteLength,gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,4,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
function addPart(x,y,z,vx,vy,vz,life){
  if(np>=MAXP) return; const i=np*8; parts[i]=x;parts[i+1]=y;parts[i+2]=z;parts[i+3]=vx;parts[i+4]=vy;parts[i+5]=vz;parts[i+6]=Math.random();parts[i+7]=life; np++;
}
function pourParticles(pt,dt){
  const n=Math.round(260*dt*60/8);
  for(let k=0;k<n;k++){
    const a=Math.random()*6.283, r=Math.sqrt(Math.random())*cells.pourR*0.45;
    addPart(pt.x+Math.cos(a)*r, pt.y+Math.sin(a)*r, cells.h0*(5+Math.random()*7), (Math.random()-0.5)*6, (Math.random()-0.5)*6, -cells.G*0.05*(0.6+Math.random()*0.5), 0);
  }
}
function spray(pt,sp){
  const n=1+Math.floor(Math.random()*3);
  for(let k=0;k<n;k++){
    const a=Math.atan2(pt.vy,pt.vx)+(Math.random()-0.5)*1.4;
    const v=sp*(0.25+Math.random()*0.35);
    addPart(pt.x+pt.dir[0]*cells.fingerR, pt.y+pt.dir[1]*cells.fingerR, cells.h0*1.1, Math.cos(a)*v, Math.sin(a)*v, cells.G*0.012*(0.5+Math.random()), 1);
  }
}
function stepParticles(dt, gx, gy, gz){
  let j=0;
  for(let i=0;i<np;i++){
    const o=i*8;
    let x=parts[o],y=parts[o+1],z=parts[o+2],vx=parts[o+3],vy=parts[o+4],vz=parts[o+5],s=parts[o+6],life=parts[o+7];
    vx+=gx*dt*0.15; vy+=gy*dt*0.15; vz-=gz*dt*0.18;
    x+=vx*dt; y+=vy*dt; z+=vz*dt;
    const ground=cells.h0;
    if(z<=ground){
      if(life<1.5 && Math.random()<0.45){ z=ground; vz=Math.abs(vz)*0.22; const a=Math.random()*6.283, b=12+Math.random()*30; vx=vx*0.3+Math.cos(a)*b; vy=vy*0.3+Math.sin(a)*b; life+=1; }
      else continue;
    }
    if(x<0||y<0||x>NX||y>NY) continue;
    const d=j*8; parts[d]=x;parts[d+1]=y;parts[d+2]=z;parts[d+3]=vx;parts[d+4]=vy;parts[d+5]=vz;parts[d+6]=s;parts[d+7]=life;
    partBuf[j*4]=x; partBuf[j*4+1]=y; partBuf[j*4+2]=Math.max(0,z-ground); partBuf[j*4+3]=s; j++;
  }
  np=j;
}

/* ------------------------------------------------------------------ */
/* Device motion → gravity in the device frame                         */
/* ------------------------------------------------------------------ */
const motion={granted:false, gotOrient:false, gotMotion:false, up:null, aig:null, sign:0, Rlow:[0,0,9.81], shake:0, asked:false, lastEvt:0};
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  motion.gotOrient=true; motion.lastEvt=performance.now();
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  motion.up=[-Math.cos(b)*Math.sin(g), Math.sin(b), Math.cos(b)*Math.cos(g)];
}
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
  motion.gotMotion=true; motion.lastEvt=performance.now();
  motion.aig=[a.x,a.y,a.z];
  if(motion.up){ const d=a.x*motion.up[0]+a.y*motion.up[1]+a.z*motion.up[2]; motion.sign=motion.sign*0.92+Math.sign(d)*0.08; }
}
function listenMotion(){
  addEventListener('deviceorientation',onOrient); addEventListener('devicemotion',onMotion);
  motion.granted=true;
  setTimeout(()=>{ if(!motion.gotOrient && !motion.gotMotion){ showPad(true); toast('Motion sensors are not available here. Use the tilt pad, or open the page directly on your phone.'); } updateTiltBtn(); },1500);
  updateTiltBtn();
}
function requestMotionPermission(){
  if(motion.asked) return; motion.asked=true;
  const DME=window.DeviceMotionEvent, DOE=window.DeviceOrientationEvent;
  if(DME && typeof DME.requestPermission==='function'){
    // both requests are issued synchronously inside the same user gesture (iOS requires that)
    Promise.all([DME.requestPermission().catch(()=>'error'), DOE&&DOE.requestPermission?DOE.requestPermission().catch(()=>'error'):'granted'])
      .then(r=>{
        if(r[0]==='granted'||r[1]==='granted') listenMotion();
        else if(r[0]==='error' && r[1]!=='denied') motion.asked=false;   // not a usable gesture: retry silently on the next tap
        else { showPad(true); toast('Tilt is off. Tap Tilt to try again, or use the tilt pad.'); updateTiltBtn(); }
        // (after a real refusal we stay quiet; only the Tilt button asks again, else every lift of a finger would re-toast)
      });
  } else if(isTouch){ listenMotion(); }
}
// Gravity reaction vector in the device frame (m/s^2, spec convention: +z when lying face-up)
function deviceReaction(){
  const m=motion;
  if(m.aig && m.up && Math.abs(m.sign)>0.3){ const s=Math.sign(m.sign); return [m.aig[0]*s,m.aig[1]*s,m.aig[2]*s]; }
  if(m.up) return [m.up[0]*9.81,m.up[1]*9.81,m.up[2]*9.81];
  if(m.aig){ const s=isIOS?-1:1; return [m.aig[0]*s,m.aig[1]*s,m.aig[2]*s]; }
  return null;
}

/* Simulated tilt: pad, keyboard, shake key */
const padEl=$('#pad'), puck=$('#puck');
let padV=[0,0], padActive=false, keyTilt=[0,0], shakeT=0;
function showPad(on){ padEl.hidden=!on; }
padEl.addEventListener('pointerdown',e=>{ e.preventDefault(); padEl.setPointerCapture(e.pointerId); padActive=true; padMove(e); firstInteraction(); noteInteraction(); });
padEl.addEventListener('pointermove',e=>{ if(padActive) padMove(e); });
const padEnd=()=>{ padActive=false; };
padEl.addEventListener('pointerup',padEnd); padEl.addEventListener('pointercancel',padEnd);
function padMove(e){ const r=padEl.getBoundingClientRect(); let x=(e.clientX-r.left)/r.width*2-1, y=(e.clientY-r.top)/r.height*2-1; const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;} padV=[x,y]; }
const keys=new Set();
addEventListener('keydown',e=>{ const k=e.key; if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s',' '].includes(k)){ e.preventDefault(); keys.add(k); if(k===' ') shakeT=0.6; firstInteraction(); if(!e.repeat) noteInteraction(); } });
addEventListener('keyup',e=>keys.delete(e.key));
let simTilt=[0,0]; // in screen space (x right, y down), magnitude 0..1
function simulatedReaction(dt){
  let tx=0,ty=0;
  if(keys.has('ArrowLeft')||keys.has('a')) tx-=1; if(keys.has('ArrowRight')||keys.has('d')) tx+=1;
  if(keys.has('ArrowUp')||keys.has('w')) ty-=1; if(keys.has('ArrowDown')||keys.has('s')) ty+=1;

  puck.style.transform=`translate(${simTilt[0]*36}px,${simTilt[1]*36}px)`;
  const mag=Math.min(1,Math.hypot(simTilt[0],simTilt[1])); const th=mag*62*Math.PI/180;
  const dir = mag>1e-4 ? [simTilt[0]/mag, simTilt[1]/mag] : [0,0];

  const nx=R0[0]*dir[0]+R0[1]*dir[1], ny=R1[0]*dir[0]+R1[1]*dir[1];
  // reaction vector: sand should flow toward dir => gravity in-plane = dir*sin(th)
  let R=[-nx*Math.sin(th)*9.81, ny*Math.sin(th)*9.81, Math.cos(th)*9.81];

/* Audio: granular hiss + crunch driven by the measured sand flow      */
/* ------------------------------------------------------------------ */
let audio=null, soundOn=true;
function initAudio(){
  if(audio) { audio.ctx.resume && audio.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const ctx=new AC();
    const sr=ctx.sampleRate, len=Math.floor(sr*2.5);
    const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.18;
    for(let k=0;k<14000;k++){
      const pos=Math.floor(Math.random()*len), amp=Math.pow(Math.random(),3)*0.9*(Math.random()<0.5?-1:1);
      const dec=(0.00015+Math.random()*0.0011)*sr, f=(1800+Math.random()*7000)/sr*6.283;
      const n=Math.min(len-pos, Math.floor(dec*5));
      for(let j=0;j<n;j++) d[pos+j]+=amp*Math.exp(-j/dec)*Math.sin(f*j);
    }
    let mx=0; for(let i=0;i<len;i++) mx=Math.max(mx,Math.abs(d[i])); for(let i=0;i<len;i++) d[i]/=mx;
    const mk=(rate)=>{ const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; s.playbackRate.value=rate; s.start(0, Math.random()*2); return s; };
    const master=ctx.createGain(); master.gain.value=0.9;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    const s1=mk(1), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.6;
    const g1=ctx.createGain(); g1.gain.value=0; s1.connect(bp); bp.connect(g1); g1.connect(master);
    const s2=mk(0.5), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
    const g2=ctx.createGain(); g2.gain.value=0; s2.connect(lp); lp.connect(g2); g2.connect(master);
    audio={ctx,g1,g2,bp};
  }catch(e){ audio=null; }
}
function updateAudio(flow, finger){
  if(!audio) return;
  const t=audio.ctx.currentTime;
  const on=soundOn?1:0;
  const hiss=on*Math.min(0.9, flow*0.75+finger*0.55);
  const rum=on*Math.min(0.8, flow*0.9);
  audio.g1.gain.setTargetAtTime(hiss*0.55, t, 0.05);
  audio.g2.gain.setTargetAtTime(rum*0.7, t, 0.08);
  audio.bp.frequency.setTargetAtTime(2400+finger*2600+flow*800, t, 0.1);
}

function castleR(){ return Math.min(120, Math.max(46, 0.15*Math.min(natW,natH)))/cs; }
// Height of the classic castle at (u,v) (castle half-widths from its centre), in units of the resting depth.
// rc = half-width in cells, used to keep crenellations at least ~2 cells wide.
function castleProfile(u,v,rc){
  const au=Math.abs(u), av=Math.abs(v), sq=Math.max(au,av);
  const rsq=Math.pow(au**6+av**6,1/6);
  let H=0;
  // packed base mound, sloping out to the tray floor
  if(rsq<1.0) H=1.2*Math.min(1,(1.0-rsq)/0.24);
  // courtyard
  if(sq<0.62) H=Math.max(H,1.5);
  const per=Math.max(4.2/rc, 0.15);               // battlement period along the walls
  const cren=(x)=>{ const f=((x/per)%1+1)%1; return f<0.5; }; // true = gap (crenel)
  // curtain walls with a walkway and crenellated parapet; gate on the near side
  if(sq>=0.56 && sq<=0.75){
    const along = au>=av ? v : u;
    let wh = sq>0.67 ? (cren(along+0.05)?1.85:2.25) : 1.95;
    if(v>0 && av>=au && Math.abs(u)<0.13) wh=1.5;    // gateway
    H=Math.max(H,wh);
  }
  // corner towers
  for(const cx of [-0.72,0.72]) for(const cy of [-0.72,0.72]){
    const d=Math.hypot(u-cx,v-cy);
    if(d<0.26){
      const a=Math.atan2(v-cy,u-cx); const nM=Math.max(5,Math.min(8,Math.round(2*Math.PI*0.21*rc/4.2)));
      const gap=((a/(2*Math.PI)*nM)%1+1)%1<0.45;
      H=Math.max(H, d>0.16 ? (gap?2.7:3.15) : 2.75);
    }
  }
  // central keep with a crenellated rim and a pointed roof
  const d=Math.hypot(u,v+0.04);
  if(d<0.32){
    const a=Math.atan2(v,u); const nM=Math.max(6,Math.min(10,Math.round(2*Math.PI*0.27*rc/4.2)));
    const gap=((a/(2*Math.PI)*nM+0.25)%1+1)%1<0.45;
    let kh = d>0.22 ? (gap?3.35:3.8) : 3.4;
    if(d<0.15) kh=3.4+1.0*(1-d/0.15);
    H=Math.max(H,kh);
  }
  return H;
}

    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900+Math.random()*300; lp.Q.value=0.7;

function addItem(kind,x,y,how){

/* Per frame: dragging, carrying, sliding under tilt / shake, falling off the edge */
let lostShown=false;
function gardenStep(dt){
  if(!items.length) return;
  const ax=gx*cs*0.35, ay=gy*cs*0.35, az=gz*cs*0.35;     // px/s^2, softened to sit well with the sand's motion
  for(const it of items){
    const K=KINDS[it.kind], h=halfOf(it);
    if(it.fadeIn>0){ it.alpha=Math.min(1,it.alpha+dt/0.2); if(it.alpha>=1) it.fadeIn=0; }
    if(it.drop>0){ it.drop=Math.max(0,it.drop-dt); const f=it.drop/0.22; it.lift=it.liftFrom*f*f; if(it.drop===0) it.lift=0; }
    if(it.st==='fade'){ it.alpha-=dt/0.35; continue; }
    if(it.st==='fall'){
      it.vx+=ax*dt; it.vy+=ay*dt; it.x+=it.vx*dt; it.y+=it.vy*dt;
      it.alpha-=dt/0.45; it.sc=Math.max(0.9, it.sc-dt*0.2); continue;
    }
    if(it.st==='carry'){
      const k=1-Math.exp(-dt*30); it.x+=(it.tx-it.x)*k; it.y+=(it.ty-it.y)*k; it.lift=h*0.42; it.sc=1.05; continue;
    }
    const x0=it.x, y0=it.y;
    if(it.st==='drag'){
      const k=1-Math.exp(-dt*20);
      it.x+=(it.tx-it.x)*k; it.y+=(it.ty-it.y)*k;
      separate(it,false); clampItem(it);
      it.vx=(it.x-x0)/dt; it.vy=(it.y-y0)/dt;
    } else {
      // resting or sliding: static friction holds it until the tray is tilted steeply or shaken hard
      let fx=ax, fy=ay;
      if(shake>0.15){ const a=Math.random()*6.283, j=(shake-0.15)*1.6*az; fx+=Math.cos(a)*j; fy+=Math.sin(a)*j; }
      const muS=K.mu*(1-0.6*shake), muD=K.muD*(1-0.5*shake), F=Math.hypot(fx,fy);
      if(it.st==='rest'){
        if(F>muS*az && it.drop===0){ it.st='slide'; it.vx=0; it.vy=0; }
        else continue;
      }
      it.vx+=fx*dt; it.vy+=fy*dt;
      const sp=Math.hypot(it.vx,it.vy), fr=muD*az*dt;
      if(sp<=fr){ it.vx=0; it.vy=0; if(F<=muS*az){ it.st='rest'; continue; } }
      else { it.vx-=it.vx/sp*fr; it.vy-=it.vy/sp*fr; }
      it.x+=it.vx*dt; it.y+=it.vy*dt;
      separate(it,false);
      // carried over the rim of the tray: gone until placed again
      if(it.x<0||it.y<0||it.x>natW||it.y>natH){
        it.st='fall';
        if(!lostShown){ lostShown=true; setTimeout(()=>toast(`The ${KINDS[it.kind].name.toLowerCase()} slid off the tray. Add items again from Garden.`), 500); }
        analytics.track('garden_item_lost', {item:it.kind, cause: shake>0.3 ? 'shake' : 'tilt', items_left: items.filter(o=>o!==it&&o.st!=='fade'&&o.st!=='fall').length});
        updateGardenUI();
        continue;
      }
    }
    // a moving item plows through the sand like a real object (not while lifted from the menu)
    const dist=Math.hypot(it.x-x0,it.y-y0);
    it.slow = it.st==='drag' && dist/dt < cs*1.0;
    if(dist>1e-3 && it.lift<0.5){
      const c=Math.cos(it.rot), s=Math.sin(it.rot), vx=it.vx/cs, vy=it.vy/cs;
      for(const [lx,ly,r] of K.plow){
        const ox=(c*lx-s*ly)*h, oy=(s*lx+c*ly)*h;

      }
      fingerEnergy+=Math.min(0.8, Math.hypot(vx,vy)/150);
    }
  }
  const before=items.length;
  items=items.filter(it=>!((it.st==='fade'||it.st==='fall') && it.alpha<=0) && !(it.st==='fall' && (it.x<-halfOf(it)*1.5||it.y<-halfOf(it)*1.5||it.x>natW+halfOf(it)*1.5||it.y>natH+halfOf(it)*1.5)));

}

/* Upload per-instance data; returns the instance count */
const I0=new Float32Array(24*4), I1=new Float32Array(24*4), I2=new Float32Array(24*4);

    I0[j]=it.x; I0[j+1]=it.y; I0[j+2]=Math.cos(it.rot); I0[j+3]=Math.sin(it.rot);

// menu thumbnails: each item lit by the same lamp, rendered once
function renderThumbs(){

/* ---- menu, drag from the menu, clear (A/B), undo ---- */

  const b=btnGarden.getBoundingClientRect(), bar=$('#bar').getBoundingClientRect();

  const left=Math.min(innerWidth-w-8, Math.max(8, b.left+b.width/2-w/2));

}
function openMenu(on){
  menuOpen=on;

  else { gardenEl.classList.remove('open'); gardenEl.classList.remove('carrying'); setTimeout(()=>{ if(!menuOpen) gardenEl.hidden=true; }, 180); }

}
function liveItems(){ return items.filter(i=>i.st!=='fade'&&i.st!=='fall'); }
function updateGardenUI(){

btnGarden.addEventListener('click',()=>{ firstInteraction(); noteInteraction(); openMenu(!menuOpen); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && menuOpen) openMenu(false); });
addEventListener('resize',()=>{ if(menuOpen) placeMenu(); });

function natFromClient(cx,cy){ const r=canvas.getBoundingClientRect(); return toNat(cx-r.left, cy-r.top); }
let tilePtr=null, suppressClick=false;
document.querySelectorAll('.gitem').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); firstInteraction();
    tilePtr={id:e.pointerId, x:e.clientX, y:e.clientY, kind:el.dataset.kind, touch:e.pointerType!=='mouse'};
    try{ el.setPointerCapture(e.pointerId); }catch(err){}

  el.addEventListener('pointermove',e=>{
    if(!tilePtr || tilePtr.id!==e.pointerId) return;
    if(!carry && Math.hypot(e.clientX-tilePtr.x,e.clientY-tilePtr.y)>8){
      // start carrying a new item out of the menu; it floats above the sand and leaves no marks
      const it=newItem(tilePtr.kind,0,0); it.st='carry'; it.alpha=1;
      carry={it, touch:tilePtr.touch};
      items.push(it);
      gardenEl.classList.add('carrying');
    }

  });
  const end=e=>{
    if(!tilePtr || tilePtr.id!==e.pointerId) return;
    const wasCarry=!!carry; tilePtr=null;
    if(wasCarry){ suppressClick=true; finishCarry(e.clientX,e.clientY, e.type==='pointerup'); }
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('click',()=>{

    const p=freeSpot(el.dataset.kind); if(!p) return;
    const it=addItem(el.dataset.kind,p[0],p[1],'tap');
    if(it){ openMenu(false); setTimeout(()=>dropSound(it.kind),200); }

});
function moveCarry(cx,cy,snap){
  const it=carry.it, h=halfOf(it);

  // on a touch screen, hold the item a little above the fingertip so it stays visible
  const lift = carry.touch ? Math.min(h*0.55, 46) : 0;
  const up = toNat(0,-lift), o0=toNat(0,0);
  it.tx=n[0]+(up[0]-o0[0]); it.ty=n[1]+(up[1]-o0[1]);
  if(snap && it.x===0 && it.y===0){ it.x=it.tx; it.y=it.ty; }
}
function finishCarry(cx,cy,ok){
  const it=carry.it; carry=null;
  const over=document.elementFromPoint(cx,cy);
  const onSand = ok && over===canvas && it.x>0 && it.y>0 && it.x<natW && it.y<natH;
  if(!onSand || liveItems().length>MAXITEMS){
    it.st='fade';
    gardenEl.classList.remove('carrying');

  }

  updateGardenUI();

$('#gYes').addEventListener('click',()=>{ const n=liveItems().length; doClear(n); });

function hideUndo(){ clearTimeout(undoTimer); undoEl.classList.remove('show'); setTimeout(()=>{ if(!undoEl.classList.contains('show')) undoEl.hidden=true; },300); }

/* Grabbing a placed item on the sand */
function grabItem(e){
  const n=natFromClient(e.clientX,e.clientY);

  it.st='drag'; it.vx=it.vy=0; it.tx=it.x; it.ty=it.y; it.drop=0; it.lift=0;
  itemDrags.set(e.pointerId,{it, ox:it.x-n[0], oy:it.y-n[1], moved:0, x0:it.x, y0:it.y});

}
function moveGrab(e){
  const d=itemDrags.get(e.pointerId); if(!d) return false;

/* ------------------------------------------------------------------ */
/* Modes: Zen Garden (sand tools, classic castle, garden items) and     */
/* Castle Builder (sand tools, a ribbon of castle pieces, flags, moat). */
/* Every session starts on the start screen with a fresh tray.          */
/* ------------------------------------------------------------------ */
let mode=null;                                                    // 'zen' | 'castle'
function trayDepth(){ return mode==='castle' ? 1.3 : 1; }        // Castle Builder starts with deeper sand to build with
function bScale(){ return Math.min(1.5, Math.max(0.95, Math.min(natW||390,natH||390)/340)); }

/* ---- castle pieces ---- */

// at local (x,y) css px: x runs along the piece (its rotation), y across it. 0 = outside the footprint.
const PIECES = {
  tower: {label:'Tower',  round:true, scalable:true},
  wall:  {label:'Wall',   dir:true},
  level: {label:'Level',  rot:true, scalable:true},
  spire: {label:'Spire',  round:true, scalable:true},
  stairs:{label:'Stairs', dir:true},
  keep:  {label:'Castle', rot:true},
  flag:  {label:'Flag'},
  moat:  {label:'Moat'},

function pieceTip(k){

    case 'wall': return 'Drag along the sand to build a wall. Keep dragging to add more pieces.';
    case 'level': return t ? 'Touch to place a new level. Twist with two fingers to turn it, pinch to resize.' : 'Click to place a new level. Scroll to turn it, Shift+scroll to resize.';
    case 'spire': return t ? 'Touch to drip a spire of wet sand. Pinch to resize.' : 'Click to drip a spire of wet sand. Shift+scroll resizes.';
    case 'stairs': return 'Touch where the stairs start and drag toward the top.';
    case 'keep': return t ? 'Touch the sand to build a whole castle. Twist with two fingers to turn it.' : 'Click the sand to build a whole castle. Scroll to turn it.';
    case 'flag': return t ? 'Touch the top of a tower or wall to plant a flag.' : 'Click the top of a tower or wall to plant a flag.';

function keepRpx(){ return Math.min(120, Math.max(46, 0.15*Math.min(natW,natH))); }

function pieceExt(k,sc){

    case 'tower': return [24*sc,24*sc];

    case 'wall': return [29*sc,8.5*sc];
    case 'level': return [40*sc,40*sc];

    case 'stairs':{
      const hx=24*sc, hy=14*sc, ax=Math.abs(x), ay=Math.abs(y);

/* ---- the ribbon ---- */
const ribbonEl=$('#ribbon'), rTiles=$('#rTiles'), rCap=$('#rCap'), rUndo=$('#rUndo');
let ribbonOpen=false, sel=null, placing=null, hover=null, ghostDirty=true;
const selAng={tower:0,wall:0,level:0,spire:0,stairs:-Math.PI/2,keep:0}, selSize={};
for(const k of PIECE_ORDER){

  rTiles.appendChild(b);
}
function openRibbon(on){

  else { ribbonEl.classList.remove('open'); ribbonEl.classList.remove('placing'); setTimeout(()=>{ if(!ribbonOpen) ribbonEl.hidden=true; },180); selectPiece(null); placing=null; }

  updateUndoBtn();
}
function selectPiece(k){

  rTiles.querySelectorAll('.ptile').forEach(t=>{ const on=t.dataset.kind===k; t.classList.toggle('on',on); t.setAttribute('aria-pressed',on); });
  rCap.textContent=pieceTip(k);

}
rUndo.addEventListener('click',()=>{ noteInteraction(); undoLast(); });

/* ---- placing pieces: touch to place, drag to lay walls, twist and pinch with a second finger ---- */
function builderActive(){ return mode==='castle' && ribbonOpen; }
function builderDown(e,p){
  if(!builderActive()) return false;
  if(placing && placing.id!==e.pointerId){
    // a second finger turns / resizes the piece being placed
    const def=PIECES[placing.kind];
    if(!placing.twist && (def.rot||def.scalable)){
      placing.twist={id:e.pointerId, p:p.slice(), a0:Math.atan2(p[1]-placing.cur[1],p[0]-placing.cur[0]), d0:Math.max(4,Math.hypot(p[0]-placing.cur[0],p[1]-placing.cur[1])), ang0:selAng[placing.kind]||0, size0:placing.size};
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    }
    return true;
  }
  if(!sel) return false;
  if(sel==='moat'){
    pushUndo();
    const pt=newPointer(p[0],p[1],'moat'); pt.moat={cells:new Set(), start:[p[0],p[1]]};
    pointers.set(e.pointerId,pt); try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    return true;
  }
  placing={id:e.pointerId, kind:sel, start:p.slice(), cur:p.slice(), path:[p.slice()], size:selSize[sel]||1, twist:null};
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  ribbonEl.classList.add('placing'); ghostDirty=true;
  return true;
}
function builderMove(e){
  if(!placing){
    if(e.pointerType==='mouse' && builderActive() && sel && sel!=='moat' && !e.buttons){ hover=cellPos(e); ghostDirty=true; }
    return false;
  }
  if(e.pointerId===placing.id){
    const p=cellPos(e); placing.cur=p;
    const lp=placing.path[placing.path.length-1];
    if(Math.hypot(p[0]-lp[0],p[1]-lp[1])*cs>2) placing.path.push(p.slice());
    if(placing.twist) applyTwist();
    ghostDirty=true; return true;
  }
  if(placing.twist && e.pointerId===placing.twist.id){ placing.twist.p=cellPos(e); applyTwist(); ghostDirty=true; return true; }
  return false;
}
// small towers and spires lose their detail on the sand grid, so they don't shrink as far as a level
function minSize(k){ return k==='level' ? 0.55 : 0.78; }
function applyTwist(){
  const g=placing, t=g.twist, def=PIECES[g.kind];
  const a=Math.atan2(t.p[1]-g.cur[1],t.p[0]-g.cur[0]), d=Math.hypot(t.p[0]-g.cur[0],t.p[1]-g.cur[1]);

}
function builderUp(e){
  if(!placing) return;

  if(e.pointerId!==placing.id) return;
  const g=placing; placing=null; ribbonEl.classList.remove('placing'); ghostDirty=true;
  if(e.type==='pointercancel') return;

}
function builderHover(p){ if(hover||p){ hover=p; ghostDirty=true; } }
function builderWheel(e){
  if(!builderActive() || !sel) return false;
  const def=PIECES[sel];
  if(e.shiftKey && def.scalable){ selSize[sel]=Math.min(1.7,Math.max(minSize(sel),(selSize[sel]||1)*Math.exp(-(e.deltaY||e.deltaX)*0.0012))); }
  else if(def.rot||def.dir){ selAng[sel]=(selAng[sel]||0)+Math.sign(e.deltaY||e.deltaX)*Math.PI/24; }

}
addEventListener('keydown',e=>{
  if(!builderActive()) return;
  if(e.key==='Escape'){ if(sel) selectPiece(null); else openRibbon(false); }
  else if((e.key==='r'||e.key==='R') && sel && (PIECES[sel].rot||PIECES[sel].dir)){ selAng[sel]=(selAng[sel]||0)+(e.shiftKey?-1:1)*Math.PI/12; ghostDirty=true; }

// arc-length parametrisation of a drag path (cells); points past the end continue in the last direction

// Shade a heightfield onto a canvas. sample(x,y) -> [height px, r,g,b (sRGB 0..1), water level px or -1]; lamp from the upper left
function shadeHF(cvs, W, H, sample, opt){
  opt=opt||{}; cvs.width=W; cvs.height=H; const ctx=cvs.getContext('2d'), img=ctx.createImageData(W,H), D=img.data;

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const s=sample(x,y), i=y*W+x; hh[i]=s[0]; col[i*3]=s[1]; col[i*3+1]=s[2]; col[i*3+2]=s[3]; wl[i]=s[4]; }

  const step=1/Math.hypot(L[0],L[1]), rise=L[2]*step;

    const i=y*W+x;
    if(opt.alphaBg && hh[i]<=0.01){
      // transparent background, with the piece's shadow
      let sh=0; for(let t=1;t<60;t++){ const qx=Math.round(x+L[0]*step*t), qy=Math.round(y+L[1]*step*t);
        if(qx<0||qy<0||qx>=W||qy>=H) break; if(hh[qy*W+qx]>rise*t){ sh=1; break; } }
      D[i*4+3]=sh?95:0; continue;
    }
    const hx=(hh[y*W+Math.min(W-1,x+1)]-hh[y*W+Math.max(0,x-1)])*0.5, hy=(hh[Math.min(H-1,y+1)*W+x]-hh[Math.max(0,y-1)*W+x])*0.5;
    const n=[-hx,-hy,1], nl=Math.hypot(...n); const ndl=Math.max(0,(n[0]*L[0]+n[1]*L[1]+n[2]*L[2])/nl);
    let sh=1; for(let t=1;t<80;t++){ const qx=Math.round(x+L[0]*step*t), qy=Math.round(y+L[1]*step*t); if(qx<0||qy<0||qx>=W||qy>=H) break; if(hh[qy*W+qx]>hh[i]+rise*t+0.3){ sh=0.35; break; } }
    const g=0.9+0.2*Math.random();
    let r=col[i*3]*g, gg=col[i*3+1]*g, b=col[i*3+2]*g;
    let lum=(0.32+1.05*ndl*sh);
    r*=lum; gg*=lum; b*=lum;

      if(Math.random()<0.004) { r=gg=b=1; } }
    D[i*4]=Math.min(255,r*255); D[i*4+1]=Math.min(255,gg*255); D[i*4+2]=Math.min(255,b*255); D[i*4+3]=255;
  }

}

function renderModeCards(){

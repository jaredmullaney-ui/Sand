  updateGardenUI();
}
function showUndo(n){
  undoEl.querySelector('span').textContent=`Cleared ${n} item${n>1?'s':''}`;
  undoEl.hidden=false; requestAnimationFrame(()=>undoEl.classList.add('show'));
  clearTimeout(undoTimer); undoTimer=setTimeout(hideUndo, 6000);
}
function hideUndo(){ clearTimeout(undoTimer); undoEl.classList.remove('show'); setTimeout(()=>{ if(!undoEl.classList.contains('show')) undoEl.hidden=true; },300); }
undoEl.querySelector('button').addEventListener('click',()=>{
  if(!undoSnap) return;
  items=items.filter(it=>it.st!=='fade');
  for(const s of undoSnap){ const it=newItem(s.kind,s.x,s.y); it.rot=s.rot; it.alpha=0; it.fadeIn=1; items.push(it); }
  analytics.track('garden_clear_undone', {items:undoSnap.length});
  if(followup && !followup.sent) followup.undone=true;
  noteInteraction();
  undoSnap=null; hideUndo(); updateGardenUI();
});

/* Grabbing a placed item on the sand */
function grabItem(e){
  const n=natFromClient(e.clientX,e.clientY);
  const it=itemAt(n[0],n[1]); if(!it) return false;
  it.st='drag'; it.vx=it.vy=0; it.tx=it.x; it.ty=it.y; it.drop=0; it.lift=0;
  itemDrags.set(e.pointerId,{it, ox:it.x-n[0], oy:it.y-n[1], moved:0, x0:it.x, y0:it.y});
  canvas.setPointerCapture(e.pointerId);
  return true;
}
function moveGrab(e){
  const d=itemDrags.get(e.pointerId); if(!d) return false;
  const n=natFromClient(e.clientX,e.clientY);
  d.it.tx=n[0]+d.ox; d.it.ty=n[1]+d.oy;
  return true;
}
function releaseGrab(e){
  const d=itemDrags.get(e.pointerId); if(!d) return false;
  itemDrags.delete(e.pointerId);
  if(d.it.st==='drag'){ d.it.st='rest'; d.it.vx=d.it.vy=0; }
  const moved=Math.hypot(d.it.x-d.x0,d.it.y-d.y0);
  if(moved>4) analytics.track('garden_item_moved', {item:d.it.kind, px:Math.round(moved)});
  return true;
}

/* ------------------------------------------------------------------ */
/* UI                                                                  */
/* ------------------------------------------------------------------ */
const hint=$('#hint'), toastEl=$('#toast');
if(!isTouch) hint.textContent='Drag to draw. Arrow keys or the tilt pad tilt the tray. Space shakes it.';
if(!isTouch) showPad(true);
let started=false, wakeLock=null;
function firstInteraction(){
  if(soundOn) initAudio();
  if(started) return; started=true;
  setTimeout(()=>{ if(!castleMode) hint.classList.add('gone'); }, 2500);
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{}); }catch(e){}
}
let toastTimer=0;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),4200); }
const btnTilt=$('#btnTilt'), btnSound=$('#btnSound');
function updateTiltBtn(){
  const live = motion.gotOrient||motion.gotMotion;
  btnTilt.classList.toggle('on', live);
  btnTilt.classList.toggle('attn', isTouch && !live && !motion.granted);
}
btnTilt.addEventListener('click',()=>{
  if(motion.gotOrient||motion.gotMotion){ showPad(padEl.hidden); return; }
  motion.asked=false; requestMotionPermission();
  if(!isTouch) toast('Tilt sensors are a phone feature. On a computer, use the arrow keys or the tilt pad.');
});
btnSound.addEventListener('click',()=>{ soundOn=!soundOn; btnSound.classList.toggle('on',soundOn); $('#sndWave').style.opacity=soundOn?1:0.15; if(soundOn) initAudio(); });
btnSound.classList.toggle('on',soundOn);
$('#btnReset').addEventListener('click',()=>{
  const data=initialHeights(NX,NY,cs);
  gl.bindTexture(gl.TEXTURE_2D,A[0]); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NX,NY,gl.RGBA,gl.FLOAT,data);
  gl.bindTexture(gl.TEXTURE_2D,B[0]); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NX,NY,gl.RGBA,gl.FLOAT,new Float32Array(NX*NY*4));
  np=0; castlesAny=false; setCastleMode(false);
});
updateTiltBtn();
if(isTouch && !(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==='function')){ motion.asked=true; listenMotion(); }

let resizeTimer=0;
function onResize(){ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ setup(true); items.forEach(it=>{ if(it.st==='rest'||it.st==='slide') clampItem(it); }); },120); }
addEventListener('resize',onResize);
screen.orientation && screen.orientation.addEventListener && screen.orientation.addEventListener('change',onResize);
addEventListener('orientationchange',onResize);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&wakeLock===null&&started){ try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{}); }catch(e){} } if(audio){ document.hidden?audio.ctx.suspend():soundOn&&audio.ctx.resume(); } });

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */
function readTex(f){ const d=new Float32Array(NX*NY*4); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.readPixels(0,0,NX,NY,gl.RGBA,gl.FLOAT,d); return d; }
window.__sand = {
  readH(){ return Array.from(readTex(fA[0])); }, readHF(){ return readTex(fA[0]); }, readB(){ return readTex(fB[0]); },
  setTilt(x,y){ padActive=true; padV=[x,y]; },
  P, cells, get N(){return [NX,NY,cs];}, get mass(){return massInfo;}, setQuality(i){ qi=i; resizeCanvas(); }, motion,
  // deterministic test hooks
  pause(on){ paused=!!on; }, setR(r){ Rover=r?r.slice():null; },
  step(n,dt){ dt=dt||1/60; for(let i=0;i<n;i++) simFrame(dt); },
  setH(h){ const d=new Float32Array(NX*NY*4); for(let i=0;i<NX*NY;i++) d[i*4]=h[i]; gl.bindTexture(gl.TEXTURE_2D,A[0]); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NX,NY,gl.RGBA,gl.FLOAT,d); },
  setTool(t){ tool=t; }, get tool(){ return tool; },
  down(id,x,y){ pointers.set(id,newPointer(x,y)); }, move(id,x,y){ const pt=pointers.get(id); if(pt){ pt.x=x; pt.y=y; } }, up(id){ pointers.delete(id); },
  get state(){ return {gx,gy,gz,shake,simTime,flowLevel,fingerEnergy,np,Rf:Rf.slice()}; },
  setMotion(o){ Object.assign(motion,o); }, onOrient:e=>onOrient(e), onMotion:e=>onMotion(e), deviceReaction:()=>deviceReaction(),
  mapping(){ return {angle,R0,R1,ROFF,vw,vh,natW,natH}; },
  castle(x,y){ return buildCastle(x,y); }, place(x,y){ return placeCastle(x,y); }, castleR:()=>castleR(), castleVolume:()=>castleVolume(),
  setCastleMode:on=>setCastleMode(on), get castleMode(){ return castleMode; }, shake(t){ shakeT=t||0.6; },
  garden:{
    add(kind,x,y,how){ return addItem(kind,x,y,how||'api'); }, get items(){ return items; }, KINDS,
    menu(on){ openMenu(on!==false); }, get variant(){ return analytics.variant; }, get events(){ return analytics.log; },
    clear(){ gClear.click(); }, at(x,y){ return itemAt(x,y); }, scale:()=>scaleOf(), readObj(){ return readTex(fObj); },
  },
};

setup(false);
renderThumbs();
let last=performance.now(), simTime=0, frameN=0, flowLevel=0, massInfo=[0,0];
let ema=16.7, lastQualityChange=performance.now();
let Rf=[0,0,9.81], Rlow=[0,0,9.81], shake=0;
let gx=0, gy=0, gz=1, paused=false, Rover=null, Rmid=[0,0,9.81];
const dbg = DEBUG ? (()=>{ const d=document.createElement('div'); d.id='dbg'; document.body.appendChild(d); return d; })() : null;

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=1/60;
  ema=ema*0.95+Math.min(dt*1000,100)*0.05;
  dt=Math.min(dt,1/30);
  frameN++;
  if(!paused) simFrame(dt);
  const G=cells.G;
  // light: fixed in the room, so it moves across the tray as the device tilts
  const ul=Math.hypot(Rlow[0],Rlow[1],Rlow[2])||1;
  const up=[Rlow[0]/ul, -Rlow[1]/ul, Rlow[2]/ul]; // sim frame (x right, y down, z up)
  let d0=[LOOK.azim[0],LOOK.azim[1],0]; const dd=d0[0]*up[0]+d0[1]*up[1];
  let dh=[d0[0]-up[0]*dd, d0[1]-up[1]*dd, -up[2]*dd]; const dl=Math.hypot(dh[0],dh[1],dh[2])||1; dh=dh.map(v=>v/dl);
  const E=LOOK.elev*Math.PI/180;
  let L=[up[0]*Math.sin(E)+dh[0]*Math.cos(E), up[1]*Math.sin(E)+dh[1]*Math.cos(E), up[2]*Math.sin(E)+dh[2]*Math.cos(E)];
  if(L[2]<0.12){ L[2]=0.12; }

  // ---- render prep ----
  run(progs.surf, fSurfA, u=>{ gl.uniform2i(u.uN,NX,NY); bindTex(progs.surf,'uA',0,A[0]); });
  gl.bindTexture(gl.TEXTURE_2D,SurfA); gl.generateMipmap(gl.TEXTURE_2D);
  const objOn=buildObj();
  run(progs.light, fSurfB, u=>{ gl.uniform2i(u.uN,NX,NY); bindTex(progs.light,'uS',0,SurfA); gl.uniform3f(u.uL,L[0],L[1],L[2]); gl.uniform1f(u.uWall,0.0);
    bindTex(progs.light,'uObj',1,ObjT); gl.uniform1i(u.uHasObj,objOn?1:0); });

  // ---- final ----
  const px=canvas._px;
  run(progs.final, null, u=>{
    gl.uniform2i(u.uN,NX,NY);
    bindTex(progs.final,'uS',0,SurfA); bindTex(progs.final,'uSL',1,SurfB); bindTex(progs.final,'uB',2,B[0]);
    bindTex(progs.final,'uG0',3,grain0); bindTex(progs.final,'uG1',4,grain1); bindTex(progs.final,'uG2',5,grain2);
    gl.uniform2f(u.uCanvas,canvas.width,canvas.height); gl.uniform1f(u.uPx,px);
    gl.uniform2f(u.uR0,R0[0],R0[1]); gl.uniform2f(u.uR1,R1[0],R1[1]); gl.uniform2f(u.uROff,ROFF[0],ROFF[1]);
    gl.uniform1f(u.uCs,cs); gl.uniform1f(u.uGS, LOOK.grainScale); gl.uniform1f(u.uGT,GT);
    gl.uniform3f(u.uL,L[0],L[1],L[2]); gl.uniform1f(u.uTime,simTime); gl.uniform1f(u.uExposure,LOOK.exposure);
    gl.uniform3fv(u.uSun,LOOK.sun); gl.uniform3fv(u.uSky,LOOK.sky);
  });

  // ---- garden items ----
  drawItems(L,px);

  // ---- particles ----
  if(np>0){
    gl.useProgram(progs.part.p); const u=progs.part.u;
    gl.uniform2f(u.uR0,R0[0],R0[1]); gl.uniform2f(u.uR1,R1[0],R1[1]); gl.uniform2f(u.uROff,ROFF[0],ROFF[1]);
    gl.uniform2f(u.uScreen,vw,vh); gl.uniform1f(u.uCs,cs); gl.uniform1f(u.uPx,px); gl.uniform3f(u.uL,L[0],L[1],L[2]); gl.uniform1f(u.uExposure,LOOK.exposure);
    gl.uniform3fv(u.uSun,LOOK.sun); gl.uniform3fv(u.uSky,LOOK.sky);
    gl.bindVertexArray(pvao); gl.bindBuffer(gl.ARRAY_BUFFER,pbuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,partBuf,0,np*4);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(u.uShadow,1); gl.drawArrays(gl.POINTS,0,np);
    gl.uniform1f(u.uShadow,0); gl.drawArrays(gl.POINTS,0,np);
    gl.disable(gl.BLEND); gl.bindVertexArray(null);
  }

  // ---- async readback of flow for sound / haptics ----
  // (only needed for sound / haptics / debug; skipping it otherwise keeps the GPU pipeline free)
  const wantFlow = (audio&&soundOn) || DEBUG || (!!navigator.vibrate && isTouch);
  if(fence){
    const st=gl.clientWaitSync(fence,0,0);
    if(st===gl.ALREADY_SIGNALED||st===gl.CONDITION_SATISFIED){
      gl.deleteSync(fence); fence=null;
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo); gl.getBufferSubData(gl.PIXEL_PACK_BUFFER,0,redData); gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);
      let m=0,k=0; for(let i=0;i<RED*RED;i++){ m+=redData[i*4]; k+=redData[i*4+1]; }
      massInfo=[m,k];
      // equivalent fraction of the tray sliding at ~30 cells/s; sqrt so small avalanches are audible
      const norm=k/(NX*NY*cells.layer*30);
      flowLevel=Math.min(1, 0.6*Math.sqrt(norm));
    }
  } else if(wantFlow && frameN%3===0){
    const bx=Math.ceil(NX/RED), by=Math.ceil(NY/RED);
    run(progs.reduce, fRed, u=>{ gl.uniform2i(u.uN,NX,NY); gl.uniform2i(u.uBlock,bx,by); gl.uniform1f(u.uLayer,cells.layer); bindTex(progs.reduce,'uA',0,A[0]); });
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo); gl.readPixels(0,0,RED,RED,gl.RGBA,gl.FLOAT,0); gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);
    fence=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0); gl.flush();
  }
  const fingerLvl=Math.min(1,fingerEnergy);
  updateAudio(flowLevel, fingerLvl);
  if(pointers.size && (tool==='finger'||tool==='rake')) haptics(fingerLvl*0.7+flowLevel*0.5); else if(shake>0.2) haptics(shake);

  // ---- adaptive quality ----
  if(!FIXQ && now-lastQualityChange>2500 && frameN>90){
    if(ema>21 && qi>0){ qi--; resizeCanvas(); lastQualityChange=now; ema=16.7; }
  }
  if(dbg && frameN%10===0) dbg.textContent=`${(1000/ema).toFixed(0)} fps  q${qi}  grid ${NX}x${NY} cs${cs.toFixed(2)}\nmass ${massInfo[0].toFixed(0)} flow ${flowLevel.toFixed(2)}\ng ${(gx/G).toFixed(2)} ${(gy/G).toFixed(2)} ${(gz/G).toFixed(2)} shake ${shake.toFixed(2)}`;
}
/* One frame of physics: gravity, tools, substeps, airborne grains */
function simFrame(dt){
  simTime+=dt;
  // ---- gravity (device frame reaction vector -> sim) ----
  let R = Rover ? Rover.slice() : ((motion.gotOrient||motion.gotMotion) && !padActive ? deviceReaction() : null);
  if(!R) R=simulatedReaction(dt);
  else if(shakeT>0){ const s=simulatedReaction(dt); R=[R[0]+s[0]-0,R[1]+s[1],R[2]]; }
  for(let i=0;i<3;i++){ Rf[i]+= (R[i]-Rf[i])*Math.min(1,dt*40); Rmid[i]+=(Rf[i]-Rmid[i])*Math.min(1,dt*12); Rlow[i]+=(R[i]-Rlow[i])*Math.min(1,dt*3); }
  // shaking = vibration above ~2 Hz; a deliberate tilt (even a quick one) must not fluidize the sand
  const jerk=Math.hypot(Rf[0]-Rmid[0],Rf[1]-Rmid[1],Rf[2]-Rmid[2]);
  shake=Math.max(shake*Math.exp(-dt*3), Math.min(0.85,(jerk-2.5)/14));
  const G=cells.G;
  gx=-Rf[0]/9.81*G; gy=Rf[1]/9.81*G;
  gz=Rf[2]/9.81*G; gz=Math.max(gz, 0.28*G);

  // ---- tools ----
  buildTools(dt);
  gardenStep(dt);
  run(progs.tool, fTool, u=>{
    gl.uniform2i(u.uN,NX,NY); gl.uniform1i(u.uSegN,segN);
    gl.uniform4fv(u.uSegA,segA); gl.uniform4fv(u.uSegB,segB); gl.uniform4fv(u.uSegC,segC);
  });
  // ---- castles: packed sand gives way to fingers, shaking and steep tilts ----
  if(castlesAny){
    const gl2=Math.hypot(gx,gy), tilt=Math.max(0, gl2/gz-0.9);
    const down= gl2>1e-6 ? [gx/gl2, gy/gl2] : [0,0];
    run(progs.pack, fA[1], u=>{
      gl.uniform2i(u.uN,NX,NY); bindTex(progs.pack,'uA',0,A[0]); bindTex(progs.pack,'uTool',1,ToolT);
      gl.uniform1f(u.uDt,dt); gl.uniform1f(u.uH0,cells.h0); gl.uniform1f(u.uShake,Math.max(0,shake-0.12)); gl.uniform1f(u.uTilt,tilt);
      gl.uniform1f(u.uSeed,(simTime*3.7)%53.); gl.uniform2f(u.uDown,down[0],down[1]);
    });
    A.reverse(); fA.reverse();
  }

  // ---- physics substeps ----
  // enough substeps that the CFL speed cap (0.5 cell/substep) stays >~150 cells/s on frame drops
  const qs=QUALITY[qi].sub, sub=Math.min(qs*2, 12, Math.max(qs, Math.ceil(dt*300))); const sdt=dt/sub;
  const vmax=0.5/sdt;
  for(let s=0;s<sub;s++){
    run(progs.vel, fA[1], u=>{
      gl.uniform2i(u.uN,NX,NY); bindTex(progs.vel,'uA',0,A[0]); bindTex(progs.vel,'uTool',1,ToolT);
      gl.uniform1f(u.uDt,sdt); gl.uniform1f(u.uMu,P.mu); gl.uniform1f(u.uMuS,P.mu*P.muStatic); gl.uniform1f(u.uHthin,cells.hthin); gl.uniform1f(u.uMuI,P.muI); gl.uniform1f(u.uVI,P.vIPx/cs); gl.uniform1f(u.uGz,gz); gl.uniform1f(u.uHmax,cells.hmax);
      gl.uniform1f(u.uKpen,G*0.6); gl.uniform1f(u.uVmax,vmax); gl.uniform1f(u.uShake,shake); gl.uniform1f(u.uTime,simTime);
      gl.uniform1f(u.uDamp,P.damp); gl.uniform2f(u.uGxy,gx,gy);
      bindTex(progs.vel,'uObj',4,ObjT); gl.uniform1i(u.uHasObj,objWas?1:0);
    });
    run(progs.k, fK, u=>{
      gl.uniform2i(u.uN,NX,NY); bindTex(progs.k,'uA',0,A[1]); bindTex(progs.k,'uTool',1,ToolT);
      gl.uniform1f(u.uDt,sdt); gl.uniform1f(u.uMuT,P.muTalus); gl.uniform1f(u.uTal,P.talus); gl.uniform1f(u.uLayer,cells.layer);
      bindTex(progs.k,'uObj',4,ObjT); gl.uniform1i(u.uHasObj,objWas?1:0);
    });
    run(progs.h, fA[0], u=>{
      gl.uniform2i(u.uN,NX,NY); bindTex(progs.h,'uA',0,A[1]); bindTex(progs.h,'uTool',1,ToolT); bindTex(progs.h,'uK',2,Kt);
      gl.uniform1f(u.uDt,sdt); gl.uniform1f(u.uMuT,P.muTalus); gl.uniform1f(u.uTal,P.talus); gl.uniform1f(u.uLayer,cells.layer);
      gl.uniform1i(u.uPourN,pourN); gl.uniform4fv(u.uPour,pourU);
      bindTex(progs.h,'uObj',4,ObjT); gl.uniform1i(u.uHasObj,objWas?1:0);
    });
    run(progs.t, fB[1], u=>{
      gl.uniform2i(u.uN,NX,NY); bindTex(progs.t,'uA',0,A[1]); bindTex(progs.t,'uB',1,B[0]); bindTex(progs.t,'uK',2,Kt); gl.uniform1f(u.uDt,sdt);
      gl.uniform1f(u.uSeed,(simTime*7.13+s*0.37)%97.); gl.uniform1f(u.uTear,P.grainTear);
    });
    B.reverse(); fB.reverse();
  }
  stepParticles(dt, gx, gy, gz);
}

requestAnimationFrame(frame);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1612">
<title>Sandtray</title>
<style>
/* Layout: one full-bleed sand canvas; small smoked-glass controls float above it. Single dark look by design. */
:root{
  --glass: rgba(28,22,17,0.44);
  --glass-hi: rgba(36,29,22,0.66);
  --ink: #f7efe3;
  --ink-dim: rgba(247,239,227,0.64);
  --accent: #f0c88c;
  --line: rgba(255,238,214,0.16);
  --bg: #1a1612;
  --font: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);}
body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:var(--ink);}
#sand{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.28);transition:opacity .4s;max-width:calc(100vw - 20px);}
#bar button{appearance:none;border:0;background:transparent;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:52px;height:50px;border-radius:999px;font:600 10px/1 var(--font);letter-spacing:.02em;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s;padding:0;}
#bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
#bar button.on{background:rgba(240,200,140,.2);color:var(--accent);}
#bar button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
#bar button.attn{color:var(--accent);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{50%{background:rgba(240,200,140,.22);}}
#bar .sep{width:1px;height:30px;background:var(--line);margin:0 3px;}
@media (max-width:480px){#bar button{width:46px}}
@media (max-width:440px){#bar button{width:42px;height:48px;font-size:9px}#bar button svg{width:21px;height:21px}#bar{gap:1px;padding:4px}}
@media (max-width:400px){#bar button{width:38px}#bar .sep{margin:0 2px}}
@media (max-width:370px){#bar button{width:35px;font-size:8.5px}#bar button svg{width:20px;height:20px}}
@media (max-width:340px){#bar button{width:32px;font-size:8px}}
#hint{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);font:500 13px/1.35 var(--font);color:var(--ink);text-align:center;white-space:nowrap;pointer-events:none;transition:opacity .9s;max-width:calc(100vw - 32px);white-space:normal;width:max-content;}
#hint.gone{opacity:0;}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:var(--glass-hi);border:1px solid var(--line);font:500 12.5px/1.35 var(--font);max-width:min(340px,calc(100vw - 32px));text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;}
#toast.show{opacity:1;}
#pad{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);touch-action:none;cursor:grab;}
#pad::before{content:"";position:absolute;inset:50% auto auto 50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1px dashed var(--line);}
#pad span{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font:600 10px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);}
#puck{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6e6,#d9b788 60%,#8a6a45);box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none;}
#fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:500 15px/1.5 var(--font);color:var(--ink);background:var(--bg);}
#dbg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));font:11px/1.3 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre;}
/* Garden menu: a small glass popover above the Garden button */
#garden{position:fixed;z-index:5;padding:12px 12px 10px;border-radius:20px;background:var(--glass-hi);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.4);width:min(340px,calc(100vw - 16px));box-sizing:border-box;opacity:0;transform:translateY(8px) scale(.97);transform-origin:var(--arrow,50%) 100%;transition:opacity .18s,transform .18s;}
#garden.open{opacity:1;transform:none;}
#garden.carrying{opacity:0;pointer-events:none;transition:opacity .12s;}
#garden .gtip{margin:0 2px 9px;font:500 12px/1.3 var(--font);color:var(--ink-dim);text-align:center;}
#garden .gitems{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
#garden .gitem{appearance:none;border:1px solid transparent;background:rgba(255,240,220,.07);border-radius:14px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:600 10.5px/1.15 var(--font);cursor:grab;touch-action:none;transition:background .15s,border-color .15s;}
#garden .gitem:hover,#garden .gitem:focus-visible{background:rgba(255,240,220,.14);border-color:var(--line);outline:none;}
#garden .gitem:active{cursor:grabbing;background:rgba(240,200,140,.18);}
#garden .gitem canvas{width:58px;height:58px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));pointer-events:none;}
#garden .gitem span{pointer-events:none;text-align:center;}
#garden .grow{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);min-height:36px;display:flex;align-items:center;justify-content:center;}
#gClear{appearance:none;border:0;background:transparent;color:var(--ink-dim);font:600 12.5px/1 var(--font);display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;cursor:pointer;touch-action:manipulation;}
#gClear:not(:disabled):hover,#gClear:focus-visible{background:rgba(255,240,220,.1);color:var(--ink);outline:none;}
#gClear:disabled{opacity:.4;cursor:default;}
#gClear[hidden]{display:none;}
#gClear svg,#undo svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#gConfirm{display:flex;align-items:center;gap:8px;width:100%;}
#gConfirm[hidden]{display:none;}
#gConfirm span{flex:1;font:500 12.5px/1.3 var(--font);color:var(--ink);padding-left:4px;}
#gConfirm button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 12.5px/1 var(--font);padding:9px 13px;border-radius:999px;cursor:pointer;touch-action:manipulation;}
#gConfirm #gYes{background:rgba(240,200,140,.22);border-color:rgba(240,200,140,.4);color:var(--accent);}
#undo{position:fixed;z-index:6;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--glass-hi);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3);font:500 13px/1 var(--font);color:var(--ink);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;}
#undo[hidden]{display:none;}
#undo.show{opacity:1;transform:translate(-50%,0);}
#undo button{appearance:none;border:0;background:rgba(240,200,140,.2);color:var(--accent);font:700 13px/1 var(--font);padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;touch-action:manipulation;}
@media (prefers-reduced-motion:reduce){#bar button.attn{animation:none}#garden,#undo{transition:none}}
</style>
</head>
<body>
<canvas id="sand" aria-label="Sand tray. Draw with your finger, tilt the device to move the sand."></canvas>
<div id="hint">Draw with your finger. Tilt or shake your phone.</div>
<div id="toast" role="status"></div>
<div id="pad" hidden aria-label="Tilt pad"><div id="puck"></div><span>Tilt</span></div>
<nav id="bar" aria-label="Sand tools">
  <button class="tool on" data-tool="finger" aria-pressed="true" title="Finger: draw and dig">
    <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10V9a1.5 1.5 0 0 1 3 0v2"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a5 5 0 0 1-4.2-2.3L4.5 15a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg><span>Finger</span></button>
  <button class="tool" data-tool="rake" aria-pressed="false" title="Rake: comb parallel grooves">
    <svg viewBox="0 0 24 24"><path d="M4 9h16"/><path d="M6 9v6M10 9v6M14 9v6M18 9v6"/><path d="M12 9V3"/></svg><span>Rake</span></button>
  <button class="tool" data-tool="smooth" aria-pressed="false" title="Smooth: level the sand">
    <svg viewBox="0 0 24 24"><path d="M3 15c3-3 5 0 9-2s5-1 9 1"/><path d="M5 19h14"/><path d="M8 10c2-4 6-5 8-4"/></svg><span>Smooth</span></button>
  <button class="tool" data-tool="pour" aria-pressed="false" title="Pour: add sand">
    <svg viewBox="0 0 24 24"><path d="M8 3h8l-2 6h-4z"/><path d="M12 11v3M11 16v1M13 17v1M12 19v1"/><path d="M5 21c2-1.5 4.5-2 7-2s5 .5 7 2"/></svg><span>Pour</span></button>
  <button id="btnCastle" aria-pressed="false" title="Castle: tap here, then tap the sand to build one">
    <svg viewBox="0 0 24 24"><path d="M3.5 21V8.5h2.5v2h2v-2h2.5V12h3V8.5H16v2h2v-2h2.5V21z"/><path d="M10 21v-3.5a2 2 0 0 1 4 0V21"/><path d="M12 8.5V3l3 1.2-3 1.2"/></svg><span>Castle</span></button>
  <button id="btnGarden" aria-expanded="false" aria-controls="garden" title="Garden: add stones, a lantern, moss or a cherry tree">
    <svg viewBox="0 0 24 24"><path d="M3 20.5c.4-2.6 2.9-4.3 6-4.3s5.6 1.7 6 4.3z"/><path d="M14.6 20.5c.3-1.9 1.8-3.1 3.6-3.1s3.2 1.2 3.4 3.1"/><path d="M12 9.5h6l-1.2 2.2h-3.6z"/><path d="M15 9.5V8M15 6.6v.1"/><path d="M13.9 11.7v4.1M16.1 11.7v4.6"/></svg><span>Garden</span></button>
  <div class="sep" aria-hidden="true"></div>
  <button id="btnTilt" title="Tilt sensors">
    <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(-14 12 12)"/><path d="M3 8a10 10 0 0 1 2-3M21 16a10 10 0 0 1-2 3"/></svg><span>Tilt</span></button>
  <button id="btnSound" title="Sound">
    <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="sndWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>Sound</span></button>
  <button id="btnReset" title="Reset the tray">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><span>Reset</span></button>
</nav>
<div id="garden" role="dialog" aria-label="Zen garden items" hidden>
  <p class="gtip">Drag an item onto the sand, or tap to add it</p>
  <div class="gitems">
    <button class="gitem" data-kind="stones" title="Three river stones"><canvas width="1" height="1"></canvas><span>Stones</span></button>
    <button class="gitem" data-kind="lantern" title="Stone lantern"><canvas width="1" height="1"></canvas><span>Lantern</span></button>
    <button class="gitem" data-kind="moss" title="Moss mound"><canvas width="1" height="1"></canvas><span>Moss</span></button>
    <button class="gitem" data-kind="tree" title="Cherry blossom tree"><canvas width="1" height="1"></canvas><span>Cherry tree</span></button>
  </div>
  <div class="grow">
    <button id="gClear"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg><span>Clear items</span></button>
    <div id="gConfirm" hidden><span>Remove all items?</span><button id="gNo">Cancel</button><button id="gYes">Remove</button></div>
  </div>
</div>
<div id="undo" role="status" hidden><span>Cleared</span><button><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#sand');
const DEBUG = /debug/.test(location.hash);
const FIXQ = /fixq/.test(location.hash);

function fail(msg){
  const d=document.createElement('div'); d.id='fail'; d.textContent=msg; document.body.appendChild(d);
}
const gl = canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
if(!gl){ fail('This browser cannot run the sand simulation because WebGL 2 is unavailable. Try a recent Safari, Chrome or Firefox.'); return; }
if(!gl.getExtension('EXT_color_buffer_float')){ fail('This device cannot render the floating-point textures the sand simulation needs.'); return; }
gl.getExtension('OES_texture_float_linear');

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

/* ------------------------------------------------------------------ */
/* Tunables (lengths in CSS px, converted to cells at init)            */
/* ------------------------------------------------------------------ */
const P = {
  depthPx: 17,          // resting sand depth
  fingerRPx: 19,        // fingertip radius
  fingerZPx: 1.0,       // how close the finger gets to the tray floor
  rakeRPx: 5.5, rakeGapPx: 19, rakeN: 5, rakeZFrac: 0.3,
  smoothRPx: 46,
  pourRPx: 7, pourRate: 1.0,   // relative
  gReal: 1.0,           // gravity scale
  mu: 0.62,             // dynamic friction: tan(angle of repose ~32deg)
  muStatic: 1.13,       // static/dynamic ratio: slopes steepen to ~35deg before they avalanche
  muI: 0.8, vIPx: 120,  // friction rises to mu*(1+muI) for flows much faster than vIPx px/s
  thinPx: 0.9,          // films thinner than this stick to the tray floor
  muTalus: 1.25, talus: 0.22,
  damp: 1.2,
  grainTear: 0.45,      // reshuffle grain offsets when neighbours are squeezed to < this many cells apart
  layerPx: 6,           // thickness of the flowing surface layer
  lightElev: 36,        // degrees
};

const QUALITY = [ {rs:0.5,sub:4}, {rs:0.62,sub:5}, {rs:0.76,sub:6}, {rs:0.9,sub:7}, {rs:1.0,sub:8} ];
let qi = isTouch ? 3 : 4;
const DPR = Math.min(window.devicePixelRatio||1, 3);

/* ------------------------------------------------------------------ */
/* GL helpers                                                          */
/* ------------------------------------------------------------------ */
const VS = `#version 300 es
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;
function compile(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s); console.error(log, src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('Shader compile failed: '+log);
  }
  return s;
}
function program(fs, vs=VS){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('Link failed: '+gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const info=gl.getActiveUniform(p,i); const name=info.name.replace(/\[0\]$/,''); u[name]=gl.getUniformLocation(p,info.name); }
  return {p,u};
}
function tex(w,h,ifmt,fmt,type,filter,wrap,data){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,data||null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter[0]);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter[1]);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrap); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrap);
  t.w=w; t.h=h; return t;
}
const NEAREST=[gl.NEAREST,gl.NEAREST], LINEAR=[gl.LINEAR,gl.LINEAR], MIPLIN=[gl.LINEAR_MIPMAP_LINEAR,gl.LINEAR];
function fbo(texs){
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  const bufs=[];
  texs.forEach((t,i)=>{ gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0); bufs.push(gl.COLOR_ATTACHMENT0+i); });
  gl.drawBuffers(bufs);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(st!==gl.FRAMEBUFFER_COMPLETE) throw new Error('FBO incomplete '+st);
  f.w=texs[0].w; f.h=texs[0].h; return f;
}
const vao=gl.createVertexArray();
function bindTex(prog,name,unit,t){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(prog.u[name],unit); }
function run(prog, target, setup){
  gl.useProgram(prog.p);
  if(target){ gl.bindFramebuffer(gl.FRAMEBUFFER,target); gl.viewport(0,0,target.w,target.h); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height); }
  setup && setup(prog.u);
  gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ------------------------------------------------------------------ */
/* Shaders                                                             */
/* ------------------------------------------------------------------ */
const COMMON = HDR + `
uniform ivec2 uN;
ivec2 cl(ivec2 p){ return clamp(p, ivec2(0), uN-ivec2(1)); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 x){ vec2 i=floor(x), f=x-i; f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
// mobile part of a column: everything above the tool's locked height and above packed castle sand (A.w)
float mobOf(vec4 s, vec4 t){ return s.x-min(s.x, max(s.w, t.x<5e3 ? t.x : 0.)); }
// garden items resting on the sand: their base footprint (uObj.z) is a wall the sand cannot flow through
uniform sampler2D uObj; uniform int uHasObj;
bool solidAt(ivec2 p){ return uHasObj==1 && texelFetch(uObj, clamp(p,ivec2(0),uN-ivec2(1)), 0).z>0.5; }
`;

/* Tool footprint: x = locked height (finger bottom), yz = push direction, w = fluidize */
const FS_TOOL = COMMON + `
uniform int uSegN;
uniform vec4 uSegA[40];
uniform vec4 uSegB[40];
uniform vec4 uSegC[40];
out vec4 o;
void main(){
  vec2 p = gl_FragCoord.xy - 0.5;
  float T = 1e4; vec2 push = vec2(0.); float fluid = 0.;
  for(int i=0;i<40;i++){
    if(i>=uSegN) break;
    vec4 A=uSegA[i], B=uSegB[i];
    vec2 a=A.xy, ab=A.zw-A.xy;
    float t=clamp(dot(p-a,ab)/max(dot(ab,ab),1e-6),0.,1.);
    vec2 d=p-(a+ab*t); float r=length(d); float R=B.x;
    if(B.z<0.5){
      if(r<R){
        float tz = B.y + R - sqrt(max(R*R-r*r,0.));
        if(tz<T){
          T=tz;
          vec2 rad = r>1e-3 ? d/r : vec2(0.);
          vec2 vel=uSegC[i].xy; float vs=length(vel); vec2 vd = vs>1e-3 ? vel/vs : vec2(0.);
          float along=dot(rad,vd), front=max(along,0.);
          // the trailing part of the swept capsule must never shove sand back into the
          // furrow just dug (that leaves a dotted trench on fast strokes): push it sideways
          if(along<0.){
            vec2 nrm=vec2(-vd.y,vd.x); float side=dot(d,nrm);
            rad -= vd*along;
            if(dot(rad,rad)<0.04) rad = nrm*(abs(side)>1e-3 ? sign(side) : (hash12(p)<0.5?-1.:1.));
            rad = normalize(rad);
          }
          vec2 dir = rad + vd*(0.25+0.75*front)*min(vs*0.02,1.0);
          if(dot(dir,dir)<1e-6) dir = vec2(hash12(p)-0.5, hash12(p+7.1)-0.5);
          push = normalize(dir);
        }
      }
    } else if(B.z<1.5){
      float f = 1.-smoothstep(R*0.55, R, r);

/* Velocity update on a staggered (MAC) grid: x = u on the right face, y = v on the top face.

const FS_VEL = COMMON + `
uniform sampler2D uA; uniform sampler2D uTool;
uniform float uDt, uMu, uMuS, uGz, uHmax, uKpen, uVmax, uShake, uTime, uDamp, uHthin, uMuI, uVI;
uniform vec2 uGxy;
out vec4 o;
bool inb(ivec2 p){ return p.x>=0&&p.y>=0&&p.x<uN.x&&p.y<uN.y; }
vec4 A(ivec2 p){ return inb(p) ? texelFetch(uA, p, 0) : vec4(0.); }
float Hc(ivec2 p){ return texelFetch(uA, cl(p), 0).x; }
float Pr(float h){ return uKpen*max(h-uHmax,0.); }
float sampleFace(vec2 q, int comp){
  vec2 g = comp==0 ? q-vec2(0.5,0.) : q-vec2(0.,0.5);
  ivec2 i0=ivec2(floor(g)); vec2 f=g-vec2(i0);
  ivec2 e = comp==0 ? ivec2(1,0) : ivec2(0,1);
  float num=0., den=0.;
  for(int k=0;k<4;k++){
    ivec2 of=ivec2(k&1, k>>1); ivec2 c=i0+of;
    if(!inb(c)||!inb(c+e)) continue;            // wall faces carry no velocity
    float w=(of.x==1?f.x:1.-f.x)*(of.y==1?f.y:1.-f.y);
    vec4 sa=A(c); float hb=A(c+e).x;
    float mw=w*(sa.x+hb+1e-4);
    num+=mw*(comp==0?sa.y:sa.z); den+=mw;
  }
  return den>0. ? num/den : 0.;

void main(){
  ivec2 p=ivec2(gl_FragCoord.xy);
  vec4 s=A(p); vec4 tl=texelFetch(uTool,p,0);
  // per-cell roughness: mostly frozen in place (ragged edges, no creep), a little flicker
  float nS=0.45*vnoise(vec2(p)/6.)+0.3*vnoise(vec2(p)/17.+3.7)+0.25*hash12(vec2(p)*1.37+0.5);
  float nT=hash12(vec2(p)*0.91+floor(uTime*4.)*19.31);
  float rough=(0.86+0.28*nS)*(0.97+0.06*nT)*(1.-uShake);
  vec2 outv=vec2(0.);
  for(int comp=0;comp<2;comp++){
    ivec2 e = comp==0 ? ivec2(1,0) : ivec2(0,1);
    ivec2 t = comp==0 ? ivec2(0,1) : ivec2(1,0);
    ivec2 b=p+e;
    if(!inb(b)) continue;                       // wall face
    vec4 sb=A(b); vec4 tb=texelFetch(uTool,b,0);
    float ma=mobOf(s,tl), mb=mobOf(sb,tb);
    if(ma+mb<1e-4) continue;

    float ut = comp==0 ? 0.25*(s.z+sb.z+A(p-t).z+A(b-t).z)
                       : 0.25*(s.y+sb.y+A(p-t).y+A(b-t).y);

    vec2 fpos = vec2(p)+0.5*vec2(e);
    float un = sampleFace(fpos-vel*uDt, comp);
    // surface slope at the face (along the face normal and across it)
    float sn = sb.x-s.x;
    float st = 0.25*(Hc(p+t)-Hc(p-t)+Hc(b+t)-Hc(b-t));
    vec2 gr = comp==0 ? vec2(sn,st) : vec2(st,sn);
    float g = comp==0 ? uGxy.x : uGxy.y;
    // tangential gravity along the surface (shallow form) and the normal load on the surface:
    // with N = gz + g.grad(h) the static condition |g - gz grad h| <= mu N is exactly
    // "surface steeper than the repose angle relative to the true horizontal", at any tilt.
    un += (g - uGz*sn - (Pr(sb.x)-Pr(s.x)))*uDt;
    float N = max(uGz + dot(uGxy,gr), 0.);
    float fl = max(tl.w,tb.w);
    // thin films grip the tray floor harder (h_stop): sliding sheets leave a ragged residue
    float hf = 0.5*(s.x+sb.x);
    float thin = 1.+0.9*exp(-hf/(uHthin*(0.4+1.2*nS)));
    float uold = comp==0 ? s.y : s.z;
    float muv = (abs(uold)<1e-3 ? uMuS : uMu)*rough*thin*(1.-0.94*fl);
    vec2 V = comp==0 ? vec2(un,ut) : vec2(ut,un);
    float sp=length(V);

    // deposit near the repose angle instead of overshooting, but steep tilts still pour freely
    muv *= 1.+uMuI*sp/(sp+uVI);

    un /= (1.+uDamp*uDt);

    // steep castle walls neither push the loose sand at their foot away nor leak speed into the flow
    if((un>0. && ma<1e-4) || (un<0. && mb<1e-4)) un=0.;

  h+=0.010*(grain-0.5)+0.004*(vn(p*60.)-0.5)-0.006*smoothstep(0.6,0.8,vn(p*30.+4.));
  TOP=h;
  // spans: the roof floats above the narrower fire box and post (light passes beneath the eaves)
  BOT = r<0.20 ? 0. : (rh<0.48 ? 0.98 : 1.48);
  GRD = r<0.20 ? h : (rh<0.66 ? 0.46 : 0.);       // pedestal around the post
  // granite: grey with black mica and white feldspar specks, darker grime, pale lichen, a little moss
  vec3 c=vec3(0.50,0.49,0.47)*(0.82+0.3*fbm(p*4.+3.));
  float s1=step(0.93,h2(floor(p*150.))), s2=step(0.95,h2(floor(p*120.)+31.));
  c=mix(c, vec3(0.16,0.16,0.17), s1*0.75); c=mix(c, vec3(0.86,0.85,0.82), s2*0.6);
  float grime=smoothstep(0.4,0.8,fbm(p*3.+11.))*(0.4+0.6*smoothstep(0.55,0.95,rh));
  c*=1.-0.45*grime;
  c*=1.-0.3*(1.-smoothstep(0.,0.07,abs(sec)*rh))*smoothstep(0.25,0.5,rh);   // rain streaks darken the hips
  float lich=smoothstep(0.62,0.72,fbm(p*6.+27.))*(1.-fin);
  c=mix(c, vec3(0.70,0.71,0.55), lich*0.7);
  float moss=smoothstep(0.66,0.76,fbm(p*9.+5.))*smoothstep(0.75,0.97,rh)*(1.-fin);
  c=mix(c, vec3(0.25,0.33,0.10), moss*0.85);
  ALB=lin(c); COV=cov;
  SPEC=0.18+0.15*fin; ROUGH=0.85-0.3*fin; SSS=0.; SHEEN=0.;
  // crevice under the finial, eave lip shading
  AO=1.-0.35*(smoothstep(0.30,0.2,r)*smoothstep(0.16,0.2,r)) - 0.15*smoothstep(0.96,1.,rh);
}

/* ---- moss mound: a dense dome of fine blades ---- */
void moss(vec2 q, float px){
  float th=atan(q.y,q.x);
  float e=length(q)/0.80;
  e*=1.+0.05*sin(3.*th+1.)+0.035*sin(5.*th+2.3)+0.02*sin(9.*th+0.4);
  float dome=0.56*pow(max(1.-e*e,0.),0.62);
  // blades: small tufts that lean outward, stretched along the radius
  // tufts of fine blades at two scales, each blade cluster a little spike
  vec2 w=q+0.012*vec2(vn(q*40.),vn(q*40.+9.));
  vec4 v=vor(w*70., 1.);
  float tuft=pow(max(1.-v.x*1.15,0.),1.4);
  vec4 v2=vor(w*150.+13., 1.);
  float fine=pow(max(1.-v2.x*1.25,0.),1.8);
  vec4 v3=vor(w*300.+29., 1.);
  float hair=pow(max(1.-v3.x*1.3,0.),2.);
  float blade=0.45*tuft+0.35*fine+0.2*hair;
  // the fuzzy rim: blades poke out past the dome
  float rim=smoothstep(1.06,0.93,e-0.08*blade);
  if(rim<=0.001 && e>1.12){ clearOut(); return; }
  float h=dome+0.022*blade*rim+0.008*(fbm(q*7.)-0.5);
  TOP=max(h,0.);
  BOT=0.; GRD=TOP;
  float tone=fbm(q*5.+4.);
  vec3 deep=vec3(0.10,0.20,0.04), mid=vec3(0.33,0.55,0.10), tipc=vec3(0.62,0.78,0.26);
  vec3 c=mix(deep, mid, smoothstep(0.05,0.5,blade));
  c=mix(c, tipc, smoothstep(0.5,0.95,blade)*0.75);
  c*=0.85+0.3*tone;
  c=mix(c, vec3(0.40,0.38,0.16), smoothstep(0.68,0.8,fbm(q*6.+21.))*0.55);   // a few drier, browner patches
  ALB=lin(c); COV=rim;
  SPEC=0.08; ROUGH=0.95; SSS=0.55; SHEEN=0.6;
  AO=mix(0.5,1.,smoothstep(0.,0.7,blade))*mix(0.7,1.,smoothstep(0.,0.25,dome));
}

/* ---- cherry blossom tree on a weathered rock, seen from above ---- */
void tree(vec2 q, float px){
  float best=-1.; float bot=0.; float cov=0.; vec3 c=vec3(0.); float sss=0., spec=0.1, rough=0.8, ao=1.;
  // blossom clumps: domes covered in small flowers
  float clT=-1.; int ci=-1; float cd=9., cr=1., cz=0.;
  for(int i=0;i<15;i++){
    float fi=float(i);
    float a=fi*2.39996+0.7, rr = i==0 ? 0.0 : 0.18+0.46*sqrt(h1(fi*7.13+1.));
    vec2 cc=vec2(cos(a),sin(a))*rr;
    float r=0.20+0.10*h1(fi*3.7+2.)-0.06*rr;
    float z=1.18+0.16*h1(fi*5.1+3.)-0.18*rr*rr;
    vec2 d=q-cc;
    float dd=length(d)/r;
    // flowers make the clump outline lumpy
    dd*=1.+0.06*(vn(q*28.+fi*3.)-0.5)*2.;
    if(dd<1.){
      float hz=z+0.62*r*sqrt(1.-dd*dd);
      if(hz>clT){ clT=hz; ci=i; cd=dd; cr=r; cz=z; }
    }
    cov=max(cov, clamp((1.-dd)*r/px+0.5,0.,1.));
  }
  // branches, seen through gaps in the blossom
  float br=-1., brc=0.;
  for(int i=1;i<15;i++){
    float fi=float(i);
    float a=fi*2.39996+0.7, rr=0.18+0.46*sqrt(h1(fi*7.13+1.));
    vec2 cc=vec2(cos(a),sin(a))*rr*0.9;
    vec2 bend=vec2(-cc.y,cc.x)*0.12*(h1(fi*9.3)-0.5);
    vec2 pa=vec2(0.), pb=cc;
    float t=clamp(dot(q,pb)/dot(pb,pb),0.,1.);
    vec2 pt=pb*t+bend*sin(t*3.1416);
    float d=length(q-pt);
    float w=0.034*(1.-0.6*t)+0.008;
    if(d<w){ float hz=0.95+0.18*t+0.02*sqrt(1.-d*d/(w*w)); if(hz>br){ br=hz; brc=d/w; } }
    cov=max(cov, clamp((w-d)/px+0.5,0.,1.)*step(0.,br));
  }
  // trunk top and the rock it grows from
  float rk=length(q*vec2(1.,1.25)+vec2(0.03,0.))/0.36;
  rk*=1.+0.12*(fbm(q*6.)-0.5);
  float rock = rk<1. ? 0.17*pow(1.-rk*rk,0.4)+0.02*(fbm(q*25.)-0.5) : -1.;
  float trunkR=length(q)/0.075;
  float trunk = trunkR<1. ? 1.00+0.02*sqrt(1.-trunkR*trunkR) : -1.;
  cov=max(cov, clamp((1.-rk)*0.36/px+0.5,0.,1.));
  // pick what is visible from above
  float top=max(max(clT,br),max(rock,trunk));
  if(top<0.){ clearOut(); return; }
  if(clT>=top-1e-5 && ci>=0){
    // flowers: five rounded petals around a deeper pink centre with pale stamens
    // two layers of flowers so the clumps read as dense blossom, with the odd gap
    float inF=0., lift=0., fr=1., petal=1.; vec2 cid=vec2(0.); float bud=0.;
    for(int L=0;L<2;L++){
      vec2 fq=q*(L==0?15.:22.)+float(L)*7.3;
      vec4 v=vor(fq, 0.9);
      vec2 id=v.zw; vec2 fo=0.5+0.9*(h22(id)-0.5);
      vec2 rel=fq-(id+fo);
      float r_=length(rel), fa=atan(rel.y,rel.x)+h1(dot(id,vec2(7.1,3.3)))*6.28;
      float pt=0.58*(0.80+0.20*cos(5.*fa))-0.07*pow(abs(cos(2.5*fa)),30.);
      float b_=h2(id+5.+float(L)*3.);
      float f=1.-smoothstep(pt-0.07,pt+0.02,r_);
      if(b_>0.9) f=0.;
      float lf=f*(0.016*(1.-r_/pt*0.5))+float(1-L)*0.006*f;
      if(lf>lift || (f>0.5 && inF<0.5)){ lift=lf; fr=r_; petal=pt; cid=id; bud=b_; }
      inF=max(inF,f);
    }
    float shade=smoothstep(1.,0.55,cd);
    best=clT+lift-0.015*(1.-inF);
    vec3 pet=mix(vec3(1.0,0.90,0.93), vec3(0.97,0.70,0.80), 0.25+0.6*h2(cid+1.));
    pet=mix(pet, vec3(0.88,0.42,0.58), (1.-smoothstep(0.06,0.24,fr))*0.75);
    float stamen=step(fr,0.13)*step(0.55,h2(floor(vec2(fr*30.,0.))+cid));
    pet=mix(pet, vec3(0.96,0.86,0.60), stamen*0.5);
    vec3 under=mix(vec3(0.82,0.55,0.62), vec3(0.42,0.44,0.22), step(0.97,h2(floor(q*40.))));
    c=mix(under, pet, inF);
    sss=0.55*inF+0.2; spec=0.08; rough=0.8;
    ao=mix(0.72,1.,inF)*mix(0.55,1.,shade);
    bot=cz-0.55*cr;
  } else if(br>=top-1e-5){
    best=br; c=mix(vec3(0.30,0.20,0.15), vec3(0.50,0.45,0.40), smoothstep(0.55,0.8,vn(q*60.))*0.6)*(0.7+0.3*(1.-brc)); bot=br-0.05; sss=0.; spec=0.06; rough=0.85; ao=0.6+0.4*(1.-brc*brc);
  } else if(trunk>=top-1e-5){
    best=trunk; c=vec3(0.24,0.16,0.12)*(0.8+0.3*vn(q*90.)); bot=0.; sss=0.; spec=0.06; rough=0.85; ao=0.8;
  } else {
    // layered, weathered rock (like the slabs in desk zen gardens)
    best=rock; float lay=sin((q.x*0.6+q.y)*70.+fbm(q*8.)*6.);
    c=mix(vec3(0.33,0.21,0.14), vec3(0.50,0.34,0.24), 0.5+0.5*lay)*(0.8+0.3*fbm(q*12.));
    bot=0.; sss=0.; spec=0.1; rough=0.8; ao=0.55+0.45*smoothstep(0.,0.6,1.-rk);
  }
  TOP=best; BOT=bot;
  GRD = trunkR<1. ? max(trunk,best) : (rk<1. ? max(rock,0.) : 0.);
  if(clT>=top-1e-5 && ci>=0) {} else if(trunkR<1. || rk<1.) BOT=0.;
  ALB=lin(c); COV=cov; SSS=sss; SPEC=spec; ROUGH=rough; AO=ao; SHEEN=0.;
}

void main(){
  vec2 t=(gl_FragCoord.xy-uOrg)/uRes;
  vec2 q=(t*2.-1.)/(1.-2.*${SPRITE_M});
  float px=2./(uRes*(1.-2.*${SPRITE_M}));
  clearOut();
  if(uKind==0) stones(q,px); else if(uKind==1) lantern(q,px); else if(uKind==2) moss(q,px); else tree(q,px);
  o0=vec4(sqrt(clamp(ALB,0.,1.)), COV);
  o1=vec4(TOP, BOT, GRD, SSS);
  o2=vec4(SPEC, ROUGH, AO, SHEEN);
}`;

/* Items, drawn as instanced quads. Per instance: I0 = centre (natural css px), cos, sin of rotation;
   I1 = half size (px), atlas slot (x,y), lift (px);  I2 = opacity, wall on/off, height scale, mode */
const VS_ITEM = `#version 300 es
precision highp float;
uniform vec4 uI0[24], uI1[24], uI2[24];
uniform int uPass;              // 0 = screen, 1 = sim-resolution occlusion map, 2 = thumbnail
uniform vec2 uR0, uR1, uROff, uScreen; uniform float uCs; uniform ivec2 uN;
uniform sampler2D uS;           // sand surface (height in cells)
out vec2 vLocal; out vec2 vNat;
flat out vec4 vI0; flat out vec4 vI1; flat out vec4 vI2; flat out float vBase;
void main(){
  int i=gl_InstanceID;
  vec4 I0=uI0[i], I1=uI1[i], I2=uI2[i];
  int k=gl_VertexID; vec2 c=vec2(k==1||k==2||k==4 ? 1. : -1., k==2||k==4||k==5 ? 1. : -1.);
  vLocal=c;
  vec2 nat=I0.xy+vec2(I0.z*c.x-I0.w*c.y, I0.w*c.x+I0.z*c.y)*I1.x;
  vNat=nat;
  // the item rests on the sand below it: average height over its middle
  float b=0.;
  if(uPass!=2){
    vec2 sz=vec2(uN);
    float r=I1.x*0.3/uCs; vec2 cc=I0.xy/uCs;
    b=textureLod(uS,cc/sz,0.).x*2.+textureLod(uS,(cc+vec2(r,0))/sz,0.).x+textureLod(uS,(cc-vec2(r,0))/sz,0.).x
     +textureLod(uS,(cc+vec2(0,r))/sz,0.).x+textureLod(uS,(cc-vec2(0,r))/sz,0.).x;
    b=b/6.*uCs;
  }
  vBase=b;
  vI0=I0; vI1=I1; vI2=I2;
  if(uPass==0){
    vec2 d=nat-uROff;
    vec2 sc=vec2(uR0.x*d.x+uR1.x*d.y, uR0.y*d.x+uR1.y*d.y);
    gl_Position=vec4(sc.x/uScreen.x*2.-1., 1.-sc.y/uScreen.y*2., 0., 1.);
  } else if(uPass==1){
    vec2 cell=nat/uCs;
    gl_Position=vec4(cell/vec2(uN)*2.-1., 0., 1.);
  } else {
    gl_Position=vec4(c.x, -c.y, 0., 1.)*vec4(I2.w, I2.w, 1., 1.);
  }
}`;
const ITEM_COMMON = HDR + `
in vec2 vLocal; in vec2 vNat;
flat in vec4 vI0; flat in vec4 vI1; flat in vec4 vI2; flat in float vBase;
uniform sampler2D uT0, uT1, uT2;
vec2 atlasUV(vec2 l){ return (vI1.yz*512. + ((l*(1.-2.*${SPRITE_M}))*0.5+0.5)*512.)/1024.; }
`;
/* Occlusion map at sim resolution: x = top of the topmost span, y = -bottom, z = wall, w = grounded top (cells) */
const FS_OBJ = ITEM_COMMON + `
uniform float uCs; uniform float uWallMin;
out vec4 o;
void main(){
  if(any(greaterThan(abs(vLocal),vec2(1.)))) discard;
  vec2 uv=atlasUV(vLocal);
  float cov=texture(uT0,uv).a;
  if(cov<0.5) discard;
  vec4 t1=texture(uT1,uv);
  float hs=vI1.x*vI2.z*vI2.x, lift=vI1.w;
  float top=vBase+lift+t1.x*hs, bot=vBase+lift+t1.y*hs, grd=t1.z*hs;
  float wall = (vI2.y>0.5 && grd>uWallMin) ? 1. : 0.;
  float g = (lift<0.5 && grd>0.05) ? vBase+grd : 0.;
  if(lift>=0.5 && grd>0.05) bot=vBase+lift;     // lifted: the grounded part floats with the rest
  o=vec4(top/uCs, -bot/uCs, wall, g/uCs);
}`;
/* Screen pass: light the relief sprite with the room lamp (same lamp, sky, exposure as the sand) */
const FS_ITEM = ITEM_COMMON + OBJOCC + `
uniform int uPass; uniform ivec2 uN; uniform float uCs, uExposure, uTime;
uniform sampler2D uS, uObj; uniform int uHasObj;
uniform vec3 uL, uSun, uSky; uniform vec2 uCanvas;
out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-0.055, step(vec3(0.0031308),c)); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float topAt(vec2 l){ return texture(uT1, atlasUV(l)).x; }
void main(){
  vec2 l=vLocal;
  if(any(greaterThan(abs(l),vec2(1.)))) discard;
  vec2 uv=atlasUV(l);
  vec4 t0=texture(uT0,uv);
  float cov=t0.a*vI2.x;
  if(cov<0.004) discard;
  vec4 t1=texture(uT1,uv), t2=texture(uT2,uv);
  float half_=vI1.x, hsc=vI2.z, lift=vI1.w;
  float hs=half_*hsc;
  float surf=vBase+lift+t1.x*hs;                 // absolute height of this point (px)
  vec2 sz=vec2(uN);
  if(uPass==0){
    // sand heaped against the item covers its lower edge (tested against the smoothed relief so
    // fine detail like moss blades doesn't let sand speckle through)
    float sand=texture(uS, vNat/uCs/sz).x*uCs;
    float surfS=vBase+lift+textureLod(uT1,uv,3.).x*hs;
    cov*=clamp((surfS+1.2-sand)/2.4,0.,1.);
    if(cov<0.004) discard;
  }
  // normal from the relief (local frame), rotated into the tray frame
  float e=1.5/512.;
  float hx=(topAt(l+vec2(e,0))-topAt(l-vec2(e,0)))/(2.*e)*hsc;
  float hy=(topAt(l+vec2(0,e))-topAt(l-vec2(0,e)))/(2.*e)*hsc;
  vec2 gL=vec2(hx,hy); float glen=length(gL); if(glen>6.) gL*=6./glen;
  float cs_=vI0.z, sn=vI0.w;
  vec2 gN=vec2(cs_*gL.x-sn*gL.y, sn*gL.x+cs_*gL.y);
  vec3 N=normalize(vec3(-gN,1.));
  vec3 L=normalize(uL);
  // fine self-shadowing, marched through the sprite's own relief
  vec2 lN=L.xy/max(length(L.xy),1e-4);
  vec2 lL=vec2(cs_*lN.x+sn*lN.y, -sn*lN.x+cs_*lN.y);   // light direction in local units
  float rise=L.z/max(length(L.xy),1e-4)/hsc;            // local height per local unit travelled
  float h0=t1.x, sh=1., t=0.012;
  for(int i=0;i<18;i++){
    vec2 s=l+lL*t;
    if(any(greaterThan(abs(s),vec2(1.)))) break;
    float hq=textureLod(uT1, atlasUV(s), 1.).x;
    sh=min(sh, clamp(0.5+(h0+t*rise-hq)/(0.05*t*rise+0.01),0.,1.));
    t*=1.32; t+=0.006;
  }
  // coarse shadows from other items and from sand (castles), outside this item's own square
  if(uPass==0){
    vec2 p=vNat/uCs; float zc=surf/uCs;
    vec2 d=lN; float rz=L.z/max(length(L.xy),1e-4);
    // distance (cells) for the ray to leave this item's bounding circle
    vec2 oc=(vNat-vI0.xy)/uCs; float R=half_*1.42/uCs;
    float bq=dot(oc,d), cq=dot(oc,oc)-R*R; float tx=-bq+sqrt(max(bq*bq-cq,0.));
    float tt=max(tx,0.6);
    for(int i=0;i<20;i++){
      vec2 q=p+d*tt;
      if(q.x<0.||q.y<0.||q.x>sz.x||q.y>sz.y) break;
      float ray=zc+tt*rz;
      float hsand=textureLod(uS,q/sz,0.).x;
      sh=min(sh, clamp(0.5+(ray-hsand)/(0.16*tt+0.22),0.,1.));
      if(uHasObj==1) sh=min(sh, 1.-objOcc(textureLod(uObj,q/sz,0.), ray, 0.35+0.07*tt));
      if(sh<0.01) break;
      tt += 0.6+tt*0.12;
    }
  }
  vec3 alb=t0.rgb*t0.rgb;
  float spec=t2.x, rough=max(t2.y,0.08), ao=t2.z, sheen=t2.w, sss=t1.w;
  float nl=max(dot(N,L),0.);
  // rough diffuse (as for the sand)
  float nv=max(N.z,0.); float sg=rough*0.6;
  float s_=L.z-nl*nv; float tq= s_>0. ? max(max(nl,nv),1e-3) : 1.;
  float diff=nl*(1.+sg*s_/tq)/(1.+0.2879*sg);
  // translucent petals and moss blades glow on the lit side and wrap light around
  float wrap=max((dot(N,L)+0.6)/1.6,0.);
  diff=mix(diff, wrap*0.85, sss*0.6);
  // specular: GGX, viewer straight above
  vec3 H=normalize(L+vec3(0,0,1));
  float a2=rough*rough*rough*rough; float nh=max(dot(N,H),0.);
  float D=a2/(3.14159*pow(nh*nh*(a2-1.)+1.,2.));
  float F=0.04+0.96*pow(1.-max(dot(H,L),0.),5.);
  float G=nl/(nl*(1.-rough*0.5)+rough*0.5+1e-4);
  float spc=D*F*G*0.25*spec*2.;
  // sky and fill: the sky is mostly above; ambient sees the baked crevices
  vec3 col = alb*uSun*diff*sh + uSun*spc*sh
           + alb*uSky*(0.55+0.45*N.z)*ao*1.1
           + alb*uSun*sss*0.10*sh*(1.-nl)*ao;
  // velvety sheen on moss: brighter at grazing angles to the lamp
  col += alb*uSun*sheen*0.12*pow(1.-nv,2.)*sh;
  col*=mix(1.,ao,0.35);
  if(uPass==0){ vec2 vq=gl_FragCoord.xy/uCanvas-0.5; col*=1.-0.22*dot(vq,vq); }
  col=srgb(aces(col*uExposure));
  col+=(hash12(gl_FragCoord.xy+fract(uTime)*91.)-0.5)/255.;
  o=vec4(col, clamp(cov,0.,1.));
}`;

let progs;
try{
  progs = {
    tool:program(FS_TOOL), vel:program(FS_VEL), k:program(FS_K), h:program(FS_H), t:program(FS_T),
    surf:program(FS_SURF), light:program(FS_LIGHT), reduce:program(FS_REDUCE),
    grain:program(FS_GRAIN), grainN:program(FS_GRAINN), final:program(FS_FINAL),
    part:program(FS_PART, VS_PART), pack:program(FS_PACK),
    sprite:program(FS_SPRITE), obj:program(FS_OBJ, VS_ITEM), item:program(FS_ITEM, VS_ITEM),
  };
}catch(e){ fail('The sand simulation failed to start on this device: '+e.message); return; }

/* ------------------------------------------------------------------ */
/* Grain texture (generated once)                                      */
/* ------------------------------------------------------------------ */
const GT = 1024;
const grain0 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
const grain1 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
const grain2 = tex(GT,GT,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,MIPLIN,gl.REPEAT);
{
  const f=fbo([grain0,grain1]);
  run(progs.grain, f, u=>{ gl.uniform1f(u.uSize,GT); });
  gl.bindTexture(gl.TEXTURE_2D,grain0); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  const f2=fbo([grain2]);

// Look of the scene: a warm lamp fixed in the room, a dim cool fill from the room, linear values
const LOOK = {
  elev: 27,                     // lamp elevation, degrees (low enough to rake the relief)
  azim: [-0.62,-0.78],          // lamp direction in the tray plane when the phone lies flat
  sun: [1.0*3.0, 0.90*3.0, 0.77*3.0],
  sky: [0.36*0.55, 0.39*0.55, 0.45*0.55],

/* Simulation state                                                    */

let NX=0, NY=0, cs=3, vw=0, vh=0, angle=0, natW=0, natH=0;

const RED=16;

function getAngle(){

// screen css -> natural css mapping
let R0=[1,0], R1=[0,1], ROFF=[0,0];

function toNat(sx,sy){ return [R0[0]*sx+R0[1]*sy+ROFF[0], R1[0]*sx+R1[1]*sy+ROFF[1]]; }

function initialHeights(nx,ny,c){
  // A freshly levelled tray: broad, gentle unevenness at several scales (as left by smoothing the sand
  // with a flat hand) down to fine grain-scale roughness.
  // Lengths in css px; slopes stay well below the angle of repose so nothing moves at rest.
  const data=new Float32Array(nx*ny*4);
  const h0=P.depthPx/c;
  const rnd=mulberry((Math.random()*4294967296)>>>0);
  const lat=new Float32Array(256); for(let i=0;i<256;i++) lat[i]=rnd()*2-1;
  const perm=new Uint8Array(512); for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[256+i]=perm[i];
  const vn=(x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y); let fx=x-xi, fy=y-yi;
    fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
    const g=(i,j)=>lat[perm[(perm[(xi+i)&255]+yi+j)&255]];
    const a=g(0,0)+(g(1,0)-g(0,0))*fx, b=g(0,1)+(g(1,1)-g(0,1))*fx; return a+(b-a)*fy; };

}
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function allocSim(nx,ny,initData){

}

function computeCells(){
  cells.h0=P.depthPx/cs; cells.fingerR=P.fingerRPx/cs; cells.fingerZ=P.fingerZPx/cs;
  cells.rakeR=P.rakeRPx/cs; cells.rakeGap=P.rakeGapPx/cs; cells.smoothR=P.smoothRPx/cs; cells.pourR=P.pourRPx/cs;
  cells.hmax=cells.h0*5.0; cells.layer=P.layerPx/cs; cells.hthin=P.thinPx/cs;

function setup(keepState){

  if(isTouch && (angle===90||angle===270)){ natW=vh; natH=vw; } else { natW=vw; natH=vh; }

// Read back the current heights and resample them into a new grid (keeps the sand on resize)

}
function resizeCanvas(){
  const q=QUALITY[qi];

/* ------------------------------------------------------------------ */
/* Input: pointers become tools                                        */
/* ------------------------------------------------------------------ */
let tool='finger';
const pointers=new Map();
function newPointer(x,y){ return {x,y,hist:[[x,y,x,y]],last:[x,y],vx:0,vy:0,t0:simTime,dir:[1,0],z:1,moved:0}; }
function cellPos(e){ const r=canvas.getBoundingClientRect(); const n=toNat(e.clientX-r.left, e.clientY-r.top); return [n[0]/cs, n[1]/cs]; }

/* Build tool segments for this frame */
const segA=new Float32Array(40*4), segB=new Float32Array(40*4), segC=new Float32Array(40*4);
const pourU=new Float32Array(6*4);
let segN=0, pourN=0, fingerEnergy=0;
function addSeg(ax,ay,bx,by,R,z,type,str,vx,vy){
  if(segN>=40) return; const i=segN*4;
  segA[i]=ax; segA[i+1]=ay; segA[i+2]=bx; segA[i+3]=by;
  segB[i]=R; segB[i+1]=z; segB[i+2]=type; segB[i+3]=str;
  segC[i]=vx; segC[i+1]=vy; segN++;
}
function buildTools(dt){

    const lx=pt.last[0], ly=pt.last[1];
    const dx=pt.x-lx, dy=pt.y-ly; const dist=Math.hypot(dx,dy);
    const ivx=dx/dt, ivy=dy/dt;
    pt.vx+= (ivx-pt.vx)*0.5; pt.vy+=(ivy-pt.vy)*0.5;
    pt.moved+=dist;
    if(dist>0.2){ const k=Math.min(1,dist/3); pt.dir=[pt.dir[0]*(1-k)+dx/dist*k, pt.dir[1]*(1-k)+dy/dist*k]; const l=Math.hypot(pt.dir[0],pt.dir[1])||1; pt.dir=[pt.dir[0]/l,pt.dir[1]/l]; }

      const plunge=Math.min(1, age/0.09);

        const zt=cells.fingerZ; const z = cells.h0*1.25*(1-plunge)+zt*plunge;
        for(const s of pt.hist) addSeg(s[0],s[1],s[2],s[3],cells.fingerR,z,0,1,pt.vx,pt.vy);
        fingerEnergy+=Math.min(1,sp/120)*plunge;
      } else {
        const zt=cells.h0*P.rakeZFrac; const z = cells.h0*1.25*(1-plunge)+zt*plunge;
        const nx=-pt.dir[1], ny=pt.dir[0];

        }

/* ------------------------------------------------------------------ */
/* Particles                                                           */
/* ------------------------------------------------------------------ */
const MAXP=2500; const parts=new Float32Array(MAXP*8); let np=0;
const partBuf=new Float32Array(MAXP*4);
const pvao=gl.createVertexArray(); const pbuf=gl.createBuffer();
gl.bindVertexArray(pvao); gl.bindBuffer(gl.ARRAY_BUFFER,pbuf); gl.bufferData(gl.ARRAY_BUFFER,partBuf.byteLength,gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,4,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
function addPart(x,y,z,vx,vy,vz,life){

function pourParticles(pt,dt){
  const n=Math.round(260*dt*60/8);

    const a=Math.random()*6.283, r=Math.sqrt(Math.random())*cells.pourR*0.45;
    addPart(pt.x+Math.cos(a)*r, pt.y+Math.sin(a)*r, cells.h0*(5+Math.random()*7), (Math.random()-0.5)*6, (Math.random()-0.5)*6, -cells.G*0.05*(0.6+Math.random()*0.5), 0);

}
function spray(pt,sp){
  const n=1+Math.floor(Math.random()*3);

    const a=Math.atan2(pt.vy,pt.vx)+(Math.random()-0.5)*1.4;
    const v=sp*(0.25+Math.random()*0.35);
    addPart(pt.x+pt.dir[0]*cells.fingerR, pt.y+pt.dir[1]*cells.fingerR, cells.h0*1.1, Math.cos(a)*v, Math.sin(a)*v, cells.G*0.012*(0.5+Math.random()), 1);

  let j=0;

    const o=i*8;
    let x=parts[o],y=parts[o+1],z=parts[o+2],vx=parts[o+3],vy=parts[o+4],vz=parts[o+5],s=parts[o+6],life=parts[o+7];
    vx+=gx*dt*0.15; vy+=gy*dt*0.15; vz-=gz*dt*0.18;
    x+=vx*dt; y+=vy*dt; z+=vz*dt;

      if(life<1.5 && Math.random()<0.45){ z=ground; vz=Math.abs(vz)*0.22; const a=Math.random()*6.283, b=12+Math.random()*30; vx=vx*0.3+Math.cos(a)*b; vy=vy*0.3+Math.sin(a)*b; life+=1; }

    }
    if(x<0||y<0||x>NX||y>NY) continue;
    const d=j*8; parts[d]=x;parts[d+1]=y;parts[d+2]=z;parts[d+3]=vx;parts[d+4]=vy;parts[d+5]=vz;parts[d+6]=s;parts[d+7]=life;
    partBuf[j*4]=x; partBuf[j*4+1]=y; partBuf[j*4+2]=Math.max(0,z-ground); partBuf[j*4+3]=s; j++;

/* ------------------------------------------------------------------ */
/* Device motion → gravity in the device frame                         */
/* ------------------------------------------------------------------ */
const motion={granted:false, gotOrient:false, gotMotion:false, up:null, aig:null, sign:0, Rlow:[0,0,9.81], shake:0, asked:false, lastEvt:0};
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  motion.gotOrient=true; motion.lastEvt=performance.now();
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  motion.up=[-Math.cos(b)*Math.sin(g), Math.sin(b), Math.cos(b)*Math.cos(g)];
}
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
  motion.gotMotion=true; motion.lastEvt=performance.now();
  motion.aig=[a.x,a.y,a.z];
  if(motion.up){ const d=a.x*motion.up[0]+a.y*motion.up[1]+a.z*motion.up[2]; motion.sign=motion.sign*0.92+Math.sign(d)*0.08; }
}
function listenMotion(){
  addEventListener('deviceorientation',onOrient); addEventListener('devicemotion',onMotion);

  setTimeout(()=>{ if(!motion.gotOrient && !motion.gotMotion){ showPad(true); toast('Motion sensors are not available here. Use the tilt pad, or open the page directly on your phone.'); } updateTiltBtn(); },1500);
  updateTiltBtn();
}
function requestMotionPermission(){
  if(motion.asked) return; motion.asked=true;
  const DME=window.DeviceMotionEvent, DOE=window.DeviceOrientationEvent;
  if(DME && typeof DME.requestPermission==='function'){
    // both requests are issued synchronously inside the same user gesture (iOS requires that)
    Promise.all([DME.requestPermission().catch(()=>'error'), DOE&&DOE.requestPermission?DOE.requestPermission().catch(()=>'error'):'granted'])
      .then(r=>{
        if(r[0]==='granted'||r[1]==='granted') listenMotion();
        else if(r[0]==='error' && r[1]!=='denied') motion.asked=false;   // not a usable gesture: retry silently on the next tap
        else { showPad(true); toast('Tilt is off. Tap Tilt to try again, or use the tilt pad.'); updateTiltBtn(); }
        // (after a real refusal we stay quiet; only the Tilt button asks again, else every lift of a finger would re-toast)
      });
  } else if(isTouch){ listenMotion(); }
}
// Gravity reaction vector in the device frame (m/s^2, spec convention: +z when lying face-up)
function deviceReaction(){
  const m=motion;
  if(m.aig && m.up && Math.abs(m.sign)>0.3){ const s=Math.sign(m.sign); return [m.aig[0]*s,m.aig[1]*s,m.aig[2]*s]; }

  if(m.aig){ const s=isIOS?-1:1; return [m.aig[0]*s,m.aig[1]*s,m.aig[2]*s]; }

}

/* Simulated tilt: pad, keyboard, shake key */
const padEl=$('#pad'), puck=$('#puck');
let padV=[0,0], padActive=false, keyTilt=[0,0], shakeT=0;
function showPad(on){ padEl.hidden=!on; }
padEl.addEventListener('pointerdown',e=>{ e.preventDefault(); padEl.setPointerCapture(e.pointerId); padActive=true; padMove(e); firstInteraction(); noteInteraction(); });
padEl.addEventListener('pointermove',e=>{ if(padActive) padMove(e); });
const padEnd=()=>{ padActive=false; };
padEl.addEventListener('pointerup',padEnd); padEl.addEventListener('pointercancel',padEnd);
function padMove(e){ const r=padEl.getBoundingClientRect(); let x=(e.clientX-r.left)/r.width*2-1, y=(e.clientY-r.top)/r.height*2-1; const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;} padV=[x,y]; }
const keys=new Set();
addEventListener('keydown',e=>{ const k=e.key; if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s',' '].includes(k)){ e.preventDefault(); keys.add(k); if(k===' ') shakeT=0.6; firstInteraction(); if(!e.repeat) noteInteraction(); } });

let simTilt=[0,0]; // in screen space (x right, y down), magnitude 0..1
function simulatedReaction(dt){

  if(keys.has('ArrowUp')||keys.has('w')) ty-=1; if(keys.has('ArrowDown')||keys.has('s')) ty+=1;

  puck.style.transform=`translate(${simTilt[0]*36}px,${simTilt[1]*36}px)`;
  const mag=Math.min(1,Math.hypot(simTilt[0],simTilt[1])); const th=mag*62*Math.PI/180;
  const dir = mag>1e-4 ? [simTilt[0]/mag, simTilt[1]/mag] : [0,0];

/* ------------------------------------------------------------------ */
/* Audio: granular hiss + crunch driven by the measured sand flow      */
/* ------------------------------------------------------------------ */
let audio=null, soundOn=true;
function initAudio(){
  if(audio) { audio.ctx.resume && audio.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const ctx=new AC();
    const sr=ctx.sampleRate, len=Math.floor(sr*2.5);
    const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.18;
    for(let k=0;k<14000;k++){
      const pos=Math.floor(Math.random()*len), amp=Math.pow(Math.random(),3)*0.9*(Math.random()<0.5?-1:1);
      const dec=(0.00015+Math.random()*0.0011)*sr, f=(1800+Math.random()*7000)/sr*6.283;
      const n=Math.min(len-pos, Math.floor(dec*5));
      for(let j=0;j<n;j++) d[pos+j]+=amp*Math.exp(-j/dec)*Math.sin(f*j);
    }
    let mx=0; for(let i=0;i<len;i++) mx=Math.max(mx,Math.abs(d[i])); for(let i=0;i<len;i++) d[i]/=mx;
    const mk=(rate)=>{ const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true; s.playbackRate.value=rate; s.start(0, Math.random()*2); return s; };
    const master=ctx.createGain(); master.gain.value=0.9;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    const s1=mk(1), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.6;
    const g1=ctx.createGain(); g1.gain.value=0; s1.connect(bp); bp.connect(g1); g1.connect(master);
    const s2=mk(0.5), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100;
    const g2=ctx.createGain(); g2.gain.value=0; s2.connect(lp); lp.connect(g2); g2.connect(master);
    audio={ctx,g1,g2,bp};
  }catch(e){ audio=null; }
}
function updateAudio(flow, finger){
  if(!audio) return;
  const t=audio.ctx.currentTime;
  const on=soundOn?1:0;
  const hiss=on*Math.min(0.9, flow*0.75+finger*0.55);
  const rum=on*Math.min(0.8, flow*0.9);
  audio.g1.gain.setTargetAtTime(hiss*0.55, t, 0.05);
  audio.g2.gain.setTargetAtTime(rum*0.7, t, 0.08);
  audio.bp.frequency.setTargetAtTime(2400+finger*2600+flow*800, t, 0.1);
}

/* Sand castles: tap Castle, then tap the sand. The castle is packed   */
/* from the tray's own sand (the area around it gets shallower) and    */

function castleR(){ return Math.min(120, Math.max(46, 0.15*Math.min(natW,natH)))/cs; }
// Height of the classic castle at (u,v) (castle half-widths from its centre), in units of the resting depth.
// rc = half-width in cells, used to keep crenellations at least ~2 cells wide.
function castleProfile(u,v,rc){
  const au=Math.abs(u), av=Math.abs(v), sq=Math.max(au,av);
  const rsq=Math.pow(au**6+av**6,1/6);
  let H=0;
  // packed base mound, sloping out to the tray floor
  if(rsq<1.0) H=1.2*Math.min(1,(1.0-rsq)/0.24);
  // courtyard
  if(sq<0.62) H=Math.max(H,1.5);
  const per=Math.max(4.2/rc, 0.15);               // battlement period along the walls
  const cren=(x)=>{ const f=((x/per)%1+1)%1; return f<0.5; }; // true = gap (crenel)
  // curtain walls with a walkway and crenellated parapet; gate on the near side
  if(sq>=0.56 && sq<=0.75){
    const along = au>=av ? v : u;
    let wh = sq>0.67 ? (cren(along+0.05)?1.85:2.25) : 1.95;
    if(v>0 && av>=au && Math.abs(u)<0.13) wh=1.5;    // gateway
    H=Math.max(H,wh);
  }
  // corner towers
  for(const cx of [-0.72,0.72]) for(const cy of [-0.72,0.72]){
    const d=Math.hypot(u-cx,v-cy);
    if(d<0.26){

    }

    const a=Math.atan2(v,u); const nM=Math.max(6,Math.min(10,Math.round(2*Math.PI*0.27*rc/4.2)));
    const gap=((a/(2*Math.PI)*nM+0.25)%1+1)%1<0.45;
    let kh = d>0.22 ? (gap?3.35:3.8) : 3.4;
    if(d<0.15) kh=3.4+1.0*(1-d/0.15);
    H=Math.max(H,kh);
  }

}

    const t=t0+dt, amp=j===2?1:0.7;
    const src=ctx.createBufferSource(); src.buffer=patBuf; src.playbackRate.value=0.8+Math.random()*0.3;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900+Math.random()*300; lp.Q.value=0.7;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9*amp,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);

/* Analytics: PostHog, loaded only when a project key is set below.    */
/* No cookies (in-memory persistence); an anonymous random id and the   */
/* A/B variant are kept in localStorage so a device stays in one group. */
/* ------------------------------------------------------------------ */
const ANALYTICS = {
  key: '',                              // PostHog project API key (starts with "phc_"); empty = analytics off
  host: 'https://us.i.posthog.com',     // or https://eu.i.posthog.com for an EU project
};
const analytics = (() => {
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
  const optOut = navigator.globalPrivacyControl===true || navigator.doNotTrack==='1';
  const on = !!ANALYTICS.key && !optOut;
  let uid = store.get('sandtray.uid');
  if(!uid){ uid = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); store.set('sandtray.uid', uid); }
  // Clear-button experiment: "undo" = clears at once with an Undo button, "confirm" = asks first.
  // #clear=undo or #clear=confirm in the URL forces a variant (for testing).
  const forced = (location.hash.match(/clear=(undo|confirm)/)||[])[1];
  let variant = forced || store.get('sandtray.ab.clear');
  if(variant!=='undo' && variant!=='confirm'){ variant = Math.random()<0.5 ? 'undo' : 'confirm'; store.set('sandtray.ab.clear', variant); }

    ph.toString = () => 'posthog (stub)'; ph.people.toString = () => 'posthog.people (stub)';
    ['capture','register','opt_out_capturing'].forEach(m => ph[m] = function(){ ph.push([m].concat([].slice.call(arguments))); });
    ph._i.push([ANALYTICS.key, {
      api_host: ANALYTICS.host, persistence: 'memory', bootstrap: { distinctID: uid },
      autocapture: false, capture_pageview: false, capture_pageleave: false,
      disable_session_recording: true, disable_surveys: true, person_profiles: 'identified_only',
    }, undefined]);
    ph.register({ clear_variant: variant, app_version: 'garden-1' });
    const sc = document.createElement('script'); sc.async = true; sc.crossOrigin = 'anonymous';
    sc.src = ANALYTICS.host.replace('.i.posthog.com', '-assets.i.posthog.com') + '/static/array.js';
    document.head.appendChild(sc);
  }
  function track(event, props){
    const p = Object.assign({ clear_variant: variant }, props||{});
    log.push([event, p]); if(log.length>200) log.shift();
    if(DEBUG) console.log('[analytics]', event, p);
    if(on){ try{ window.posthog.capture(event, p); }catch(e){} }

})();

function newItem(kind,x,y){
  return {id:itemSeq++, kind, x, y, rot:Math.random()*Math.PI*2, lift:0, liftFrom:0, drop:0, alpha:1, fadeIn:0, sc:1, vx:0, vy:0, st:'rest', tx:x, ty:y, slow:true};
}
function clampItem(it){
  const r=KINDS[it.kind].rb*halfOf(it)*0.8;

}
// push `it` out of the bases of the other items it overlaps
function separate(it, hard){
  const ri=KINDS[it.kind].rb*halfOf(it);
  for(const o of items){
    if(o===it || o.st==='fade' || o.st==='fall' || o.st==='carry') continue;
    const ro=KINDS[o.kind].rb*halfOf(o); let dx=it.x-o.x, dy=it.y-o.y; let d=Math.hypot(dx,dy);
    const need=(ri+ro)*(hard?0.92:0.85);
    if(d<need){
      if(d<1e-3){ const a=Math.random()*6.283; dx=Math.cos(a); dy=Math.sin(a); d=1; }
      const push=need-d; it.x+=dx/d*push; it.y+=dy/d*push;

// the place with the most room around it, near the middle (for a tap on a menu item)
function freeSpot(kind){
  const h=KINDS[kind].half*scaleOf(), r=KINDS[kind].rb*h;

  for(let k=0;k<160;k++){
    const x=r+Math.random()*(natW-2*r), y=r+Math.random()*(natH-2*r);
    let room=1e9; for(const o of items){ if(o.st==='fade'||o.st==='fall') continue; room=Math.min(room, Math.hypot(x-o.x,y-o.y)-KINDS[o.kind].rb*halfOf(o)-r); }

    const centre=Math.hypot((x-natW/2)/natW,(y-natH*0.45)/natH);
    const s=room-centre*320;

}
function addItem(kind,x,y,how){
  if(items.filter(i=>i.st!=='fade'&&i.st!=='fall').length>=MAXITEMS){ toast('The tray is full. Clear some items first.'); return null; }
  const it=newItem(kind,x,y); clampItem(it);
  items.push(it); separate(it,true); clampItem(it);
  if(how==='tap'){ it.liftFrom=halfOf(it)*0.5; it.lift=it.liftFrom; it.drop=0.22; it.alpha=0; it.fadeIn=1; }
  noteInteraction();

}
function dropSound(kind){
  if(!audio||!soundOn) return;
  const ctx=audio.ctx, t=ctx.currentTime+0.005;
  const heavy = kind==='moss' ? 0.5 : 1;
  if(!patBuf){ const n=Math.floor(ctx.sampleRate*0.25); patBuf=ctx.createBuffer(1,n,ctx.sampleRate); const c=patBuf.getChannelData(0); for(let i=0;i<n;i++) c[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.035)); }
  const src=ctx.createBufferSource(); src.buffer=patBuf; src.playbackRate.value=0.6+Math.random()*0.15;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=kind==='moss'?500:800;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7*heavy,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t+0.25);
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(kind==='stones'?150:110,t); o.frequency.exponentialRampToValueAtTime(50,t+0.1);
  const og=ctx.createGain(); og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.5*heavy,t+0.005); og.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(og); og.connect(ctx.destination); o.start(t); o.stop(t+0.16);
}

/* Per frame: dragging, carrying, sliding under tilt / shake, falling off the edge */
let lostShown=false;
function gardenStep(dt){
  if(!items.length) return;
  const ax=gx*cs*0.35, ay=gy*cs*0.35, az=gz*cs*0.35;     // px/s^2, softened to sit well with the sand's motion
  for(const it of items){
    const K=KINDS[it.kind], h=halfOf(it);
    if(it.fadeIn>0){ it.alpha=Math.min(1,it.alpha+dt/0.2); if(it.alpha>=1) it.fadeIn=0; }
    if(it.drop>0){ it.drop=Math.max(0,it.drop-dt); const f=it.drop/0.22; it.lift=it.liftFrom*f*f; if(it.drop===0) it.lift=0; }
    if(it.st==='fade'){ it.alpha-=dt/0.35; continue; }
    if(it.st==='fall'){
      it.vx+=ax*dt; it.vy+=ay*dt; it.x+=it.vx*dt; it.y+=it.vy*dt;
      it.alpha-=dt/0.45; it.sc=Math.max(0.9, it.sc-dt*0.2); continue;
    }
    if(it.st==='carry'){
      const k=1-Math.exp(-dt*30); it.x+=(it.tx-it.x)*k; it.y+=(it.ty-it.y)*k; it.lift=h*0.42; it.sc=1.05; continue;
    }
    const x0=it.x, y0=it.y;
    if(it.st==='drag'){
      const k=1-Math.exp(-dt*20);
      it.x+=(it.tx-it.x)*k; it.y+=(it.ty-it.y)*k;
      separate(it,false); clampItem(it);
      it.vx=(it.x-x0)/dt; it.vy=(it.y-y0)/dt;
    } else {
      // resting or sliding: static friction holds it until the tray is tilted steeply or shaken hard
      let fx=ax, fy=ay;
      if(shake>0.15){ const a=Math.random()*6.283, j=(shake-0.15)*1.6*az; fx+=Math.cos(a)*j; fy+=Math.sin(a)*j; }
      const muS=K.mu*(1-0.6*shake), muD=K.muD*(1-0.5*shake), F=Math.hypot(fx,fy);
      if(it.st==='rest'){
        if(F>muS*az && it.drop===0){ it.st='slide'; it.vx=0; it.vy=0; }
        else continue;
      }
      it.vx+=fx*dt; it.vy+=fy*dt;
      const sp=Math.hypot(it.vx,it.vy), fr=muD*az*dt;
      if(sp<=fr){ it.vx=0; it.vy=0; if(F<=muS*az){ it.st='rest'; continue; } }
      else { it.vx-=it.vx/sp*fr; it.vy-=it.vy/sp*fr; }
      it.x+=it.vx*dt; it.y+=it.vy*dt;
      separate(it,false);
      // carried over the rim of the tray: gone until placed again
      if(it.x<0||it.y<0||it.x>natW||it.y>natH){
        it.st='fall';
        if(!lostShown){ lostShown=true; setTimeout(()=>toast(`The ${KINDS[it.kind].name.toLowerCase()} slid off the tray. Add items again from Garden.`), 500); }
        analytics.track('garden_item_lost', {item:it.kind, cause: shake>0.3 ? 'shake' : 'tilt', items_left: items.filter(o=>o!==it&&o.st!=='fade'&&o.st!=='fall').length});
        updateGardenUI();
        continue;
      }
    }
    // a moving item plows through the sand like a real object (not while lifted from the menu)
    const dist=Math.hypot(it.x-x0,it.y-y0);
    it.slow = it.st==='drag' && dist/dt < cs*1.0;
    if(dist>1e-3 && it.lift<0.5){
      const c=Math.cos(it.rot), s=Math.sin(it.rot), vx=it.vx/cs, vy=it.vy/cs;
      for(const [lx,ly,r] of K.plow){
        const ox=(c*lx-s*ly)*h, oy=(s*lx+c*ly)*h;
        addSeg((x0+ox)/cs,(y0+oy)/cs,(it.x+ox)/cs,(it.y+oy)/cs, r*h/cs, cells.h0*K.keep, 0, 1, vx, vy);
      }
      fingerEnergy+=Math.min(0.8, Math.hypot(vx,vy)/150);
    }
  }
  const before=items.length;
  items=items.filter(it=>!((it.st==='fade'||it.st==='fall') && it.alpha<=0) && !(it.st==='fall' && (it.x<-halfOf(it)*1.5||it.y<-halfOf(it)*1.5||it.x>natW+halfOf(it)*1.5||it.y>natH+halfOf(it)*1.5)));
  if(items.length!==before) updateGardenUI();
}

/* Upload per-instance data; returns the instance count */
const I0=new Float32Array(24*4), I1=new Float32Array(24*4), I2=new Float32Array(24*4);
function packItems(list){
  let n=0;
  for(const it of list){
    if(n>=24) break; const K=KINDS[it.kind], h=halfOf(it)*it.sc, j=n*4;
    I0[j]=it.x; I0[j+1]=it.y; I0[j+2]=Math.cos(it.rot); I0[j+3]=Math.sin(it.rot);
    I1[j]=h; I1[j+1]=K.slot[0]; I1[j+2]=K.slot[1]; I1[j+3]=it.lift;
    const wall = it.alpha>0.6 && it.lift<0.5 && (it.st==='rest' || (it.st==='drag' && it.slow));
    I2[j]=Math.max(0,Math.min(1,it.alpha)); I2[j+1]=wall?1:0; I2[j+2]=K.hsc; I2[j+3]=0;
    n++;
  }

}
function setItemUniforms(prog,n){
  const u=prog.u;
  gl.uniform4fv(u.uI0,I0); gl.uniform4fv(u.uI1,I1); gl.uniform4fv(u.uI2,I2);
}
// sim-resolution occlusion / wall map
function buildObj(){
  const active=items.length>0;
  if(!active && !objWas) return false;
  objWas=active;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fObj); gl.viewport(0,0,NX,NY);
  gl.clearColor(0,-400,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.clearColor(0,0,0,0);
  if(active){
    const n=packItems(items);
    const pr=progs.obj; gl.useProgram(pr.p);
    setItemUniforms(pr,n);
    gl.uniform1i(pr.u.uPass,1); gl.uniform1f(pr.u.uCs,cs); gl.uniform2i(pr.u.uN,NX,NY); gl.uniform1f(pr.u.uWallMin,cells.h0*cs*0.25);
    bindTex(pr,'uS',0,SurfA); bindTex(pr,'uT0',1,sprT0); bindTex(pr,'uT1',2,sprT1); bindTex(pr,'uT2',3,sprT2);
    gl.enable(gl.BLEND); gl.blendEquation(gl.MAX); gl.blendFunc(gl.ONE,gl.ONE);
    gl.bindVertexArray(vao); gl.drawArraysInstanced(gl.TRIANGLES,0,6,n);
    gl.blendEquation(gl.FUNC_ADD); gl.disable(gl.BLEND);
  }
  gl.bindTexture(gl.TEXTURE_2D,ObjT); gl.generateMipmap(gl.TEXTURE_2D);
  return active;
}
function drawItems(L,px){
  if(!items.length) return;
  const list=sortedItems(); const n=packItems(list);
  const pr=progs.item; gl.useProgram(pr.p); const u=pr.u;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  setItemUniforms(pr,n);
  gl.uniform1i(u.uPass,0); gl.uniform2f(u.uR0,R0[0],R0[1]); gl.uniform2f(u.uR1,R1[0],R1[1]); gl.uniform2f(u.uROff,ROFF[0],ROFF[1]);
  gl.uniform2f(u.uScreen,vw,vh); gl.uniform1f(u.uCs,cs); gl.uniform2i(u.uN,NX,NY); gl.uniform2f(u.uCanvas,canvas.width,canvas.height);
  gl.uniform3f(u.uL,L[0],L[1],L[2]); gl.uniform3fv(u.uSun,LOOK.sun); gl.uniform3fv(u.uSky,LOOK.sky); gl.uniform1f(u.uExposure,LOOK.exposure); gl.uniform1f(u.uTime,simTime);
  gl.uniform1i(u.uHasObj,1);
  bindTex(pr,'uS',0,SurfA); bindTex(pr,'uT0',1,sprT0); bindTex(pr,'uT1',2,sprT1); bindTex(pr,'uT2',3,sprT2); bindTex(pr,'uObj',4,ObjT);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.bindVertexArray(vao); gl.drawArraysInstanced(gl.TRIANGLES,0,6,n);

}
// menu thumbnails: each item lit by the same lamp, rendered once
function renderThumbs(){
  const S=144, t=tex(S,S,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,LINEAR,gl.CLAMP_TO_EDGE), f=fbo([t]);
  gl.bindTexture(gl.TEXTURE_2D,null);
  const pr=progs.item, u=pr.u, buf=new Uint8Array(S*S*4);
  const E=34*Math.PI/180, L=[LOOK.azim[0]*Math.cos(E), LOOK.azim[1]*Math.cos(E), Math.sin(E)];
  for(const name of KIND_ORDER){
    const K=KINDS[name];
    gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.viewport(0,0,S,S); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(pr.p);
    I0.fill(0); I1.fill(0); I2.fill(0);
    I0[0]=0; I0[1]=0; I0[2]=Math.cos(0.5); I0[3]=Math.sin(0.5); I1[0]=K.half; I1[1]=K.slot[0]; I1[2]=K.slot[1]; I1[3]=0; I2[0]=1; I2[2]=K.hsc; I2[3]=0.62+0.38*K.half/82;
    setItemUniforms(pr,1);
    gl.uniform1i(u.uPass,2); gl.uniform1f(u.uCs,1); gl.uniform2i(u.uN,1,1);
    gl.uniform3f(u.uL,L[0],L[1],L[2]); gl.uniform3fv(u.uSun,LOOK.sun); gl.uniform3fv(u.uSky,LOOK.sky); gl.uniform1f(u.uExposure,LOOK.exposure*1.15); gl.uniform1f(u.uTime,0);
    gl.uniform1i(u.uHasObj,0);
    bindTex(pr,'uS',0,SurfA); bindTex(pr,'uT0',1,sprT0); bindTex(pr,'uT1',2,sprT1); bindTex(pr,'uT2',3,sprT2); bindTex(pr,'uObj',4,ObjT);
    gl.bindVertexArray(vao); gl.drawArraysInstanced(gl.TRIANGLES,0,6,1);
    gl.readPixels(0,0,S,S,gl.RGBA,gl.UNSIGNED_BYTE,buf);
    const cv=document.querySelector(`.gitem[data-kind="${name}"] canvas`); if(!cv) continue;
    cv.width=S; cv.height=S; const c2=cv.getContext('2d'); const img=c2.createImageData(S,S);
    for(let y=0;y<S;y++) img.data.set(buf.subarray((S-1-y)*S*4,(S-y)*S*4), y*S*4);
    c2.putImageData(img,0,0);
  }

/* ---- menu, drag from the menu, clear (A/B), undo ---- */
const btnGarden=$('#btnGarden'), gardenEl=$('#garden'), gClear=$('#gClear'), gConfirm=$('#gConfirm'), undoEl=$('#undo');
let menuOpen=false, carry=null, undoSnap=null, undoTimer=0;
function placeMenu(){
  const b=btnGarden.getBoundingClientRect(), bar=$('#bar').getBoundingClientRect();
  const w=gardenEl.offsetWidth;
  const left=Math.min(innerWidth-w-8, Math.max(8, b.left+b.width/2-w/2));
  gardenEl.style.left=left+'px'; gardenEl.style.bottom=(innerHeight-bar.top+10)+'px';
  gardenEl.style.setProperty('--arrow', (b.left+b.width/2-left)+'px');
}
function openMenu(on){
  menuOpen=on;
  if(on){ setCastleMode(false); gardenEl.hidden=false; gConfirm.hidden=true; gClear.hidden=false; updateGardenUI(); placeMenu(); requestAnimationFrame(()=>gardenEl.classList.add('open')); }
  else { gardenEl.classList.remove('open'); gardenEl.classList.remove('carrying'); setTimeout(()=>{ if(!menuOpen) gardenEl.hidden=true; }, 180); }
  btnGarden.classList.toggle('on',on); btnGarden.setAttribute('aria-expanded',on);
}
function liveItems(){ return items.filter(i=>i.st!=='fade'&&i.st!=='fall'); }
function updateGardenUI(){
  const n=liveItems().length;
  gClear.disabled = n===0;
  gClear.querySelector('span').textContent = n ? `Clear ${n} item${n>1?'s':''}` : 'Clear items';
}
btnGarden.addEventListener('click',()=>{ firstInteraction(); noteInteraction(); openMenu(!menuOpen); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && menuOpen) openMenu(false); });
addEventListener('resize',()=>{ if(menuOpen) placeMenu(); });

function natFromClient(cx,cy){ const r=canvas.getBoundingClientRect(); return toNat(cx-r.left, cy-r.top); }
let tilePtr=null, suppressClick=false;
document.querySelectorAll('.gitem').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); firstInteraction();
    tilePtr={id:e.pointerId, x:e.clientX, y:e.clientY, kind:el.dataset.kind, touch:e.pointerType!=='mouse'};
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove',e=>{
    if(!tilePtr || tilePtr.id!==e.pointerId) return;
    if(!carry && Math.hypot(e.clientX-tilePtr.x,e.clientY-tilePtr.y)>8){
      // start carrying a new item out of the menu; it floats above the sand and leaves no marks
      const it=newItem(tilePtr.kind,0,0); it.st='carry'; it.alpha=1;
      carry={it, touch:tilePtr.touch};
      items.push(it);
      gardenEl.classList.add('carrying');
    }
    if(carry) moveCarry(e.clientX,e.clientY,true);
  });
  const end=e=>{
    if(!tilePtr || tilePtr.id!==e.pointerId) return;
    const wasCarry=!!carry; tilePtr=null;
    if(wasCarry){ suppressClick=true; finishCarry(e.clientX,e.clientY, e.type==='pointerup'); }
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('click',()=>{
    if(suppressClick){ suppressClick=false; return; }
    const p=freeSpot(el.dataset.kind); if(!p) return;
    const it=addItem(el.dataset.kind,p[0],p[1],'tap');
    if(it){ openMenu(false); setTimeout(()=>dropSound(it.kind),200); }
  });
});
function moveCarry(cx,cy,snap){
  const it=carry.it, h=halfOf(it);
  const n=natFromClient(cx,cy);
  // on a touch screen, hold the item a little above the fingertip so it stays visible
  const lift = carry.touch ? Math.min(h*0.55, 46) : 0;
  const up = toNat(0,-lift), o0=toNat(0,0);
  it.tx=n[0]+(up[0]-o0[0]); it.ty=n[1]+(up[1]-o0[1]);
  if(snap && it.x===0 && it.y===0){ it.x=it.tx; it.y=it.ty; }
}
function finishCarry(cx,cy,ok){
  const it=carry.it; carry=null;
  const over=document.elementFromPoint(cx,cy);
  const onSand = ok && over===canvas && it.x>0 && it.y>0 && it.x<natW && it.y<natH;
  if(!onSand || liveItems().length>MAXITEMS){
    it.st='fade';
    gardenEl.classList.remove('carrying');
    return;
  }
  it.st='rest'; it.liftFrom=it.lift; it.drop=0.16; it.sc=1; it.vx=it.vy=0;
  separate(it,true); clampItem(it);
  openMenu(false);
  dropSound(it.kind); try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  noteInteraction(); if(followup && !followup.sent) followup.placed++;
  hideUndo();
  analytics.track('garden_item_placed', {item:it.kind, via:'drag', items:liveItems().length});
  updateGardenUI();
}

// Clear: variant "undo" clears at once and offers Undo; variant "confirm" asks first
gClear.addEventListener('click',()=>{
  const n=liveItems().length; if(!n) return;
  noteInteraction();
  analytics.track('garden_clear_tapped', {items:n});
  if(analytics.variant==='confirm'){
    gConfirm.querySelector('span').textContent=`Remove all ${n} item${n>1?'s':''}?`;
    gClear.hidden=true; gConfirm.hidden=false; $('#gNo').focus({preventScroll:true});
  } else {
    doClear(n);
    showUndo(n);
  }
});
$('#gNo').addEventListener('click',()=>{ noteInteraction(); analytics.track('garden_clear_cancelled', {items:liveItems().length}); gConfirm.hidden=true; gClear.hidden=false; });
$('#gYes').addEventListener('click',()=>{ const n=liveItems().length; doClear(n); });
function doClear(n){
  undoSnap=liveItems().map(it=>({kind:it.kind,x:it.x,y:it.y,rot:it.rot}));
  for(const it of items){ if(it.st!=='fall'){ it.st='fade'; } }
  for(const [id,d] of itemDrags) itemDrags.delete(id);
  openMenu(false);
  analytics.track('garden_clear_done', {items:n});
